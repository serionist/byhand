[[sign]]
id = "pt-staged-reveal"
category = "phrase"
kinds = ["post", "document"]
models = "any"
what = "Stages a point before making it: a question it answers at once (E a melhor parte?, O detalhe?), or já parou para pensar…?"
instead = "State the point; let the fact carry it."
strength = "weak"
# Já paraste is the European form of the source's Brazilian já parou.
check = '''\b(?:e a melhor parte|o detalhe)\?\s+\S|\bjá (?:paraste|parou) para pensar\b'''
flags = "Trocámos de fornecedor de café. O detalhe? A sala de reuniões está sempre cheia."
passes = "Trocámos de fornecedor de café e a sala de reuniões anda mais cheia. O detalhe do contrato fica para amanhã?"
sources = [
  { source = "evitar-escrita-ia", where = "SKILL.md, 8 Dialeto LinkedIn e Instagram, Ganchos de infomercial, commit a4b596e6f8b0", seen = 2026-11-09 },
  { source = "humanizer-pt-br", where = "patterns/pergunta-retorica.yaml, commit a18e130ad39e", seen = 2026-11-09 },
]

# Words.

[[sign]]
id = "pt-ai-vocabulary"
category = "word"
kinds = ["post", "document"]
models = "any"
what = "Leans on the words Portuguese model prose favours: ecossistema digital, enfatizando, holístico, sinergia, vamos mergulhar. One alone is ordinary Portuguese."
instead = "Use the plain word, or the fact the word stands in for."
strength = "weak"
terms = [
  { term = '''ecossistema (?:de inovação|digital)''', instead = "name the parts" },
  { term = '''enfatizando''', instead = "cut, or say it plainly" },
  { term = '''holístic[ao]s?''', instead = "say what it covers" },
  { term = '''sinergias?''', instead = "say who does what together" },
  { term = '''vamos mergulhar''', instead = "cut" },
]
flags = "Vamos mergulhar numa cidade com uma abordagem holística da cultura e uma sinergia única entre bairros."
passes = "A cidade tem dois teatros, um cinema ao ar livre no verão e mercado às quintas."
sources = [
  { source = "andrade-2026-portuguese", where = "3.1, Tabela 4: enfatizando among the ten most distinctive machine terms", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 1 Léxico, Nível 1A, commit a4b596e6f8b0", seen = 2026-11-09 },
  { source = "humanizer-pt-br", where = "patterns/abordagem-holistica.yaml, adjetivo-robusto.yaml, ecossistema-metafora.yaml, sinergia.yaml and vamos-mergulhar.yaml, commit a18e130ad39e", seen = 2026-11-09 },
]

# Formatting: what the text looks like on the page.

[[sign]]
id = "pt-dash-pivots"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Uses the long dash as a pivot: once in a sentence, before its punchline, or joined to the words on both sides. Portuguese sets an aside between two spaced travessões and opens dialogue with one."
instead = "Use a colon, a comma or a full stop; keep the travessão for a real aside or dialogue."
strength = "weak"
# A sentence with one spaced dash and no second one before its end, on a line with no dash before it: an aside has
# two, and a line of dialogue starts with one, so neither is found.
check = '''[^\W\d_]—[^\W\d_]|^(?:[^—\n]*[.!?]\s+)?[^—.!?\n]+ — [^—.!?\n]+[.!?]'''
flags = "A feira volta no domingo — e desta vez com pastéis de nata."
passes = "A feira — que esteve fechada em agosto — volta no domingo, e desta vez com pastéis de nata."
sources = [
  { source = "resende-castilho-2026-style", where = "3.3: no em dashes in the human Brazilian original or translation, 9.5 and 27.3 per 1,000 tokens in GPT-4o's", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 5 Formatação, Travessão, commit a4b596e6f8b0", seen = 2026-11-09 },
  { source = "wikipedia-pt", where = "Uso excessivo de travessões, de 2022 a setembro de 2026, revision 73274816", seen = 2026-11-09 },
]
