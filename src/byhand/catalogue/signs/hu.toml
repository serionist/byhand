[[sign]]
id = "hu-calque-phrases"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Builds on English frames in Hungarian words: helps to do, including, makes it possible, serves as."
instead = "Use Hungarian's own: is after the noun for including, no verb for 'is', the bare verb, or the verb with -hat/-het for 'can'."
strength = "weak"
# segít takes only abstract infinitives here, so chat's "segítesz feltölteni?" passes. -ként szolgál is in the present
# only: "katonaként szolgált" is a plain past.
terms = [
  { term = '\w+ként\s+szolgál(?:hat|hatnak|nak)?', instead = "arra való, or X a Y" },
  { term = 'beleértve', instead = "a …-t is, köztük" },
  { term = 'lehetővé\s+t(?:eheti|ehetik|enné|enni|esz|eszi|eszik|ett|ette|ették|éve)', instead = "a -hat/-het ending, or így … tud" },
  { term = 'segít(?:enek|ett|ettek|het|hetnek)?\s+(?:az?\s+\w+\s+)?(?:biztosítani|csökkenteni|előmozdítani|erősíteni|fejleszteni|felismerni|fenntartani|javítani|kezelni|megelőzni|megérteni|megőrizni|minimalizálni|növelni|optimalizálni)', instead = "the verb itself: csökkenti, kevesebb lesz" },
]
flags = "Az új beosztás segít csökkenteni a túlórát, és lehetővé teszi, hogy mindenki kivegye a szabadságát, beleértve a gyakornokokat is."
passes = "Az új beosztással kevesebb lesz a túlóra, és mindenki ki tudja venni a szabadságát, a gyakornokok is."
sources = [
  { source = "hun-ai-test", where = "mszny_test_final.csv, our count of each term per 100,000 characters, human then AI: -ként szolgál 0.1 and 0.8, beleértve 0.5 and 4.4, lehetővé tesz 1.3 and 9.8, segít with one of these infinitives 0.1 and 2.9, commit c7c387679336", seen = 2026-11-08 },
  { source = "humanizer-hu", where = "SKILL.md, 10. Anglicizmusok és tükörfordítások and 18. A létige kerülése, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 3", seen = 2026-11-08 },
