# English's signs. A sign here cites a source that covers English; the shape of a sign is in `any.toml`. A term is a
# regular-expression fragment, and `validate` wraps the list in `\b`, so a term stands as a word of its own.

# Words and phrases of every model. Corroborated across model families, not only in GPT's text.

[[sign]]
id = "en-ai-vocabulary"
category = "word"
kinds = ["any"]
models = "any"
what = "Leans on the same few elevated words; one is chance, several together are not."
instead = "Use the plain word, or the fact the word stands in for."
strength = "weak"
terms = [
  { term = 'delv(?:e|es|ed|ing)', instead = "look at" },
  { term = 'pivotal', instead = "name why it matters" },
  { term = 'crucial', instead = "needed" },
  { term = 'multifaceted', instead = "name the parts" },
  { term = 'underscor(?:ed|ing)|underscores (?:the|a|an|its|how|that|this|their|our)', instead = "shows" },
  { term = 'foster(?:s|ed|ing)', instead = "build" },
  { term = 'interplay', instead = "how A affects B" },
  { term = 'interconnectedness', instead = "links" },
  { term = 'intricate', instead = "detailed" },
  { term = 'complexities', instead = "problems" },
  { term = 'nuanced', instead = "say what the nuance is" },
  { term = 'tapestry', instead = "mix" },
  { term = 'vibrant', instead = "lively" },
  { term = 'seamless(?:ly)?', instead = "smooth" },
  { term = 'robust', instead = "say how it holds up" },
  { term = 'transformative', instead = "say what changed" },
  { term = 'aligns? with', instead = "matches" },
  { term = 'leverag(?:e|es|ed|ing)', instead = "use" },
]
flags = "The report underscores a pivotal shift and the intricate interplay of cost and demand."
passes = "The report shows a big shift: costs rose and demand fell. File names can hold underscores."
sources = [
  { source = "wikipedia-en", where = "High density of AI vocabulary words, revision 1384165696", seen = 2026-11-07 },
  { source = "slop-forensics", where = "results_by_domain/essays/analysis, ten model profiles, commit c313f042620f", seen = 2026-11-07 },
  { source = "russell-2025-detectors", where = "arXiv v2, expert clues: AI vocabulary", seen = 2026-11-07 },
]

[[sign]]
id = "en-significance-phrases"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Reaches for set phrases that inflate a subject's importance."
instead = "Say what happened and to whom."
strength = "usual"
terms = [
  { term = 'play(?:s|ed|ing)? an? (?:crucial|pivotal|vital) role', instead = "say what it does" },
  { term = '(?:is|stands as|serves as) a testament to', instead = "shows" },
  { term = 'mark(?:s|ed|ing)? a (?:pivotal|significant) (?:moment|shift)', instead = "give the date and the change" },
  { term = 'enduring legacy', instead = "say what remains" },
  { term = 'indelible mark', instead = "say what changed" },
  { term = 'evolving landscape', instead = "name the market or field" },
  { term = 'setting the stage for', instead = "led to" },
  { term = 'reflects? broader', instead = "name the trend, or cut" },
  { term = 'valuable insights', instead = "say what was learnt" },
]
flags = "The festival stands as a testament to the town's enduring legacy."
passes = "The festival has run every August since 1971."
sources = [
  { source = "wikipedia-en", where = "Undue emphasis on significance, legacy, and broader trends, revision 1384165696", seen = 2026-11-07 },
  { source = "slop-forensics", where = "results_by_domain/essays/slop_lists/slop_list_trigrams.json, commit c313f042620f", seen = 2026-11-07 },
]

[[sign]]
id = "en-copula-avoidance"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Avoids plain 'is' and 'has' with grander verbs."
instead = "Write 'is' or 'has'."
strength = "weak"
terms = [
  { term = 'serv(?:es|ed|ing) as an?', instead = "is" },
  { term = 'stands as an?', instead = "is" },
  { term = 'functions as an?', instead = "is" },
  { term = 'boasts an?', instead = "has" },
  { term = 'holds the distinction of being', instead = "is" },
]
