# Japanese's signs. A sign here cites a source that covers Japanese; the shape of a sign is in `any.toml`. Japanese is
# written without spaces (`spaces = false` in languages.toml), so a term gets no word edge: write each so it can't match
# inside a longer word. The set phrases of mail and chat (お世話になっております, よろしくお願いいたします) are a
# person's, never a sign, and `tests/test_office_ja.py` holds that no strong or usual check fires on them.

# Formatting.

[[sign]]
id = "ja-bold-not-rendered"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Leaves Markdown bold against Japanese brackets, where it shows as bare asterisks."
instead = "Drop the asterisks, or put them inside the brackets."
strength = "usual"
check = '''[」』）]\*\*[ぁ-んァ-ヶー一-龠々]|[ぁ-んァ-ヶー一-龠々]\*\*[「『（]'''
flags = "設定画面の**「自動保存」**をオンにします。"
passes = "設定画面の「自動保存」をオンにします。"
sources = [
  { source = "yomiyasu", where = "references/gemini-syntax.md, 原則 14, commit 8394e099486a", seen = 2026-11-07 },
  { source = "stop-ai-slop-jp", where = "references/phrases.md, 8 機械的なアーティファクト, commit e09d32796f25", seen = 2026-11-07 },
]

[[sign]]
id = "ja-em-dash"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Sets off an aside or trails off with dashes, an English habit."
instead = "Use 、 and a particle, or end the sentence."
strength = "weak"
check = '''[ぁ-んァ-ヶー一-龠々」』）、]\s?(?:――|——|─{1,2}|―|—)\s?[ぁ-んァ-ヶー一-龠々「『（。]'''
flags = "見積もりは――特に送料は――来週までに出ます。"
passes = "見積もりは、特に送料は、来週までに出ます。"
sources = [
  { source = "yomiyasu", where = "references/slop-catalog.md, 2 英語を直訳したような構文; references/gemini-syntax.md, 原則 9 and 研究 6, commit 8394e099486a", seen = 2026-11-07 },
  { source = "stop-ai-slop-jp", where = "references/phrases.md, 8 機械的なアーティファクト, commit e09d32796f25", seen = 2026-11-07 },
]

[[sign]]
id = "ja-trailing-colon"
category = "formatting"
# Not mail or chat: a person ends a reply with a colon before pasting a link or a draft.
kinds = ["post", "document"]
models = "any"
what = "Ends a sentence with a colon before a list, as English does."
instead = "End it with 。"
strength = "weak"
check = '''[ぁ-ん]：\s*$'''
flags = "今週変わる点が二つある：\n- 提出日を金曜に移す"
passes = "今週変わる点が二つある。\n- 提出日を金曜に移す"
sources = [
  { source = "yomiyasu", where = "references/gemini-syntax.md, 原則 12, commit 8394e099486a", seen = 2026-11-07 },
  { source = "zaitsu-2025-japanese", where = "S1 Data, our count: the full-width colon in 1 of 100 human texts and in up to 12 of 50 per model", seen = 2026-11-07 },
]

# Structure: how the text is built. Most have no `check`, as only the model's own read can find them.

[[sign]]
id = "ja-pause-comma"
category = "structure"
kinds = ["any"]
models = "any"
what = "Puts a comma straight after a short topic, subject or object, where no reader needs a pause."
instead = "Drop it; keep commas after long phrases, conditions and contrasts."
strength = "weak"
flags = "新しい名簿は、金曜に、総務へ送ります。"
passes = "新しい名簿は金曜に総務へ送ります。"
sources = [
  { source = "yomiyasu", where = "references/slop-catalog.md, 9 間を作るだけの読点; CHANGELOG.md, 2.5.0 measurements, commit 8394e099486a", seen = 2026-11-07 },
