]

[[sign]]
id = "any-defensive-qualification"
category = "structure"
kinds = ["any"]
models = "any"
what = "Adds caveats nobody asked for about how far a source goes, aimed at a claim no one made."
instead = "Limit a claim only where a reader could overreach, and give the finding."
strength = "usual"
flags = "The minutes record a delay in March. They should be read as background, not as a verdict on the contractor."
passes = "The report blames the delay on the port strike; it doesn't cover the earlier staff shortage."
sources = [
