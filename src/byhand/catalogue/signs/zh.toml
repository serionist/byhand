  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/phrases-zh.md.txt, 正能量收尾模板; structures.md.txt, 15, commit 9b91ed9464b9", seen = 2026-11-07 },
  { source = "speak-human-tw", where = "references/patterns.md, 32 通用積極結論, commit 89b96e24fcfd", seen = 2026-11-07 },
]

[[sign]]
id = "zh-officialese"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Inflates a plain action into a padded one, such as 进行了深入的分析 for analysed. A notice's fixed wording, such as 对单据进行审核, is not this."
instead = "Use the verb itself, with who did it."
strength = "weak"
check = '[进進]行了(?:深入|全面|系[统統])的?(?:[优優]化|[审審]核|[处處]理|分析|梳理|[讨討][论論]|探[讨討]|[沟溝]通|[调調]研|研究)'
flags = "客服组对上个月的投诉进行了深入分析。"
passes = "客服把上个月的投诉看了一遍，发现一半是快递慢。"
sources = [
  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/structures.md.txt, 21 动词名词化, its exemption for official wording, commit 9b91ed9464b9", seen = 2026-11-07 },
  { source = "slop-gate", where = "rules/chinese.json, zh-jinxing, commit f78d5cbee0dc", seen = 2026-11-07 },
]

