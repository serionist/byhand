[[sign]]
id = "any-didactic-aside"
category = "structure"
kinds = ["any"]
models = "any"
what = "Stops to tell the reader which part deserves their attention."
instead = "State the point; the reader decides what to note."
strength = "usual"
check = '''\bit(?:['’]s| is) (?:essential|crucial|important|worth) (?:noting|to note)'''
