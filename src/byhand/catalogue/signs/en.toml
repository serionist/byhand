  { source = "wikipedia-en", where = "Avoidance of basic copulatives, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-en", where = "Signs of human writing, Syntax, revision 1384165696", seen = 2026-11-07 },
]

[[sign]]
id = "en-trailing-participle"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Hangs an -ing clause of commentary off the end of a sentence."
instead = "Stop at the full stop, or make the point its own sentence."
strength = "usual"
check = ',\s(?:highlighting|underscoring|emphasi[sz]ing|showcasing|reflecting|symboli[sz]ing|cementing|solidifying) (?:the|a|an|its|their|his|her|how|our)\b|,\scontributing to\b'
flags = "The firm opened a second site in 2019, highlighting its commitment to the region."
passes = "She waved from the platform, holding her hat on in the wind."
sources = [
  { source = "wikipedia-en", where = "Superficial analyses, revision 1384165696", seen = 2026-11-07 },
  { source = "reinhart-2025-pnas", where = "arXiv v2: present participial clauses 2 to 5 times the human rate in instruction-tuned models", seen = 2026-11-07 },
]

[[sign]]
id = "en-negation-pivot"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Pivots on 'it's not X, it's Y' or 'not just X but Y'."
instead = "Write the second half alone."
strength = "weak"
check = '''\b(?:it|this|that)(?:['’]s| is)(?:n['’]t| not) (?:just |only |merely |about )*[^.\n]{1,50}(?:[,;:]|\s[-–—])\s*(?:it|this|that)(?:['’]s| is)\b|\bnot (?:just|only|merely) [^.\n]{1,60}\bbut\b'''
flags = "It's not a phone, it's a way of life."
passes = "It isn't ready yet, but it should be by Friday."
sources = [
  { source = "wikipedia-en", where = "Negative parallelisms, revision 1384165696", seen = 2026-11-07 },
  { source = "russell-2025-detectors", where = "arXiv v2, Table 3, sentence structure", seen = 2026-11-07 },
  { source = "vale-ai-tells", where = "styles/ai-tells/ContrastiveNegation.yml, commit 51f646e366ba", seen = 2026-11-07 },
]

