]

[[sign]]
id = "zh-first-next-last"
category = "structure"
kinds = ["any"]
models = "any"
what = "Lays any topic out in three even steps marked 首先, 其次 and 最后, whatever the logic."
instead = "Follow the logic: two points if there are two, joined by what links them."
strength = "weak"
check = '首先[，,][^\n]*其次[，,][^\n]*最[后後][，,]'
flags = "首先，盘点库存；其次，联系供应商；最后，更新报价单。"
passes = "先盘一下库存，缺的找供应商补，报价单我晚点改。"
sources = [
  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/structures.md.txt, 8 机械排列, commit 9b91ed9464b9", seen = 2026-11-07 },
  { source = "speak-human-tw", where = "references/patterns.md, 26 編號切碎段落, commit 89b96e24fcfd", seen = 2026-11-07 },
]

