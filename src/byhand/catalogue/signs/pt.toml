[[sign]]
id = "pt-staged-reveal"
category = "phrase"
kinds = ["post", "document"]
models = "any"
what = "Stages a point before making it: a question it answers at once (E a melhor parte?, O detalhe?), or já parou para pensar…?"
instead = "State the point; let the fact carry it."
strength = "weak"
# Já paraste is the European form of the source's Brazilian já parou.
check = '''\b(?:e a melhor parte|o detalhe)\?\s+\S|\bjá (?:paraste|parou) para pensar\b'''
flags = "Trocámos de fornecedor de café. O detalhe? A sala de reuniões está sempre cheia."
passes = "Trocámos de fornecedor de café e a sala de reuniões anda mais cheia. O detalhe do contrato fica para amanhã?"
sources = [
  { source = "evitar-escrita-ia", where = "SKILL.md, 8 Dialeto LinkedIn e Instagram, Ganchos de infomercial, commit a4b596e6f8b0", seen = 2026-11-09 },
  { source = "humanizer-pt-br", where = "patterns/pergunta-retorica.yaml, commit a18e130ad39e", seen = 2026-11-09 },
]

