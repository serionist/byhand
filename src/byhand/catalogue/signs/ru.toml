[[sign]]
id = "ru-stock-openers"
category = "phrase"
kinds = ["any"]
models = "any"
# Not «на сегодняшний день» or «в настоящее время», which people write in plain mail.
what = "Opens with a line about the modern world or what everyone knows."
instead = "Start with the subject."
strength = "weak"
terms = [
  { term = 'в современном мире', instead = "cut" },
  { term = 'каждый из нас', instead = "say who" },
  { term = '(?:ни для кого )?не секрет, что', instead = "cut" },
]
flags = "Не секрет, что очереди раздражают всех, а в современном мире время дороже денег."
passes = "Очередь в столовой к часу дня доходит до двери, так что ходите к двенадцати."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 22, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-throat-clearing"
category = "phrase"
# Not mail or chat, where «давайте разберёмся» opens a plain call to sort something out.
kinds = ["post", "document", "deck"]
models = "any"
what = "Spends a sentence on what it is about to say, or on how frank it is being."
instead = "Start with the point."
strength = "weak"
terms = [
  { term = 'без лишних слов', instead = "cut" },
  { term = 'вот в ч[её]м (?:фокус|штука)', instead = "cut" },
  { term = 'вот что (?:важно|нужно) знать', instead = "cut" },
  { term = 'давайте начистоту', instead = "cut" },
  { term = 'давайте разбер[её]мся', instead = "cut" },
  { term = 'если копнуть глубже', instead = "cut" },
  { term = 'настоящий вопрос в том', instead = "ask it" },
  { term = 'погрузимся в', instead = "cut" },
]
flags = "Без лишних слов: вторая касса окупится за полгода. Если копнуть глубже, дело в очереди."
passes = "Вторая касса нужна из-за очереди: в обед люди стоят по десять минут."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 25, 26 and 29, commit ff990df404f7", seen = 2026-11-08 },
]

