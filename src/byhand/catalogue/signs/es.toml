# Formatting: what the text looks like on the page.

[[sign]]
id = "es-dash-pivots"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Uses the long dash the English way, as a pivot: spaced on both sides, or joined to the words on both sides. Spanish opens a raya before an aside and closes it after, and starts dialogue with one."
instead = "Use a colon, a comma or a full stop; keep the raya for a real aside or dialogue."
strength = "weak"
check = '''[^\W\d_]—[^\W\d_]| — '''
flags = "El mercadillo vuelve el domingo — y esta vez con churros."
passes = "El mercadillo —que estuvo cerrado en agosto— vuelve el domingo, y esta vez con churros."
sources = [
  { source = "humanizer-es", where = "skills/humanizer-es/SKILL.md, E1; evals/contestants/omel/SKILL.md, ES-RAYA-01 and ES-RAYA-03, commit ac2a31be1a71", seen = 2026-11-09 },
  { source = "resende-castilho-2026-style", where = "3.3: no em dashes in the human Spanish texts, 2.9 and 25.3 per 1,000 tokens in GPT-4o's", seen = 2026-11-09 },
]
