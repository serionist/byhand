# Portuguese's signs, for Brazil, Portugal and the rest alike: a variety is no sign of AI (wikipedia-pt says so), and a
# sign that held for one variety only would be left out. A sign here cites a source that covers Portuguese; the shape
# of a sign is in `any.toml`. A term is a regular-expression fragment, and `validate` wraps the list in `\b`, so a term
# starts and ends at a word's edge. Portuguese inflects for gender, number and person, so a term lists its forms.
#
# Order: every alternation, every term list and every list of examples in a `what` or `instead` runs in alphabetical
# order of its plain text, accents and case ignored, as in every language (tests/test_order.py).
#
# What these rest on: Andrade et al. 2026 measured Sabiá-3's Brazilian fake news against people's; Resende and Castilho
# 2026 measured GPT-4o's Brazilian story; evitar-escrita-ia (European) and humanizer-pt-br (Brazilian) list tells for a
# rewriting skill, with no evidence of their own: humanizer-pt-br's counts are of texts Grok was asked to fill with
# tells. So a sign from either rests on both, or on another source beside it, and lists only what a source names.
# any-negative-parallelism holds the set-up contrast for Portuguese too, and leaves out a real correction: Portuguese
# writes não é só X, é Y to add, to correct and as a model's foil, and no check of the shape the review tried told them
# apart (#55's review, F22, F25, F27, F29). Left out, as Portuguese reports, papers and news are full of them: a word
# English's lists translate (abrangente, crucial, robusto), a field's term (ecossistema de inovação, ecossistema
# digital, holístico, sinergia), a phrase people use (divisor de águas, mais do que nunca, na era da inteligência
# artificial, na era digital, no cenário atual), and the hinges both skills list (cabe ressaltar que, é importante
# destacar que), which papers write two to a paragraph, Andrade et al.'s among them. None measured work mail. Each
# Portuguese sign is weak on that evidence (#72): evitar-escrita-ia calls its words and phrases a strong sign only
# several to a text, and people write each alone; the measured habits are rates over many texts, which one person's
# text can match; a school essay stacks its connectors; and the dash is weak in every language, as people write it.
# The Portuguese checks read posts and documents, but the dash, as the set phrases of mail (Fico à disposição, Qualquer
# dúvida, é só dizer, Sem mais para o momento) are a person's.
# A calque of English (a full stop after a list label, alavancar, endereçar um problema, Espero que esta mensagem o
# encontre bem, Title Case) is translationese, which people write too: no source measures models writing one more than
# people, so none has a sign. Brazilian forms in text for Portugal, or European ones in Brazil, are a variety, not a
# sign. Portuguese typography is no tell either: the travessão before dialogue and around a spaced aside, « » and “ ”.
# tests/test_office_pt.py holds plain mail, chat and reports from both varieties against every sign that counts alone,
# and against a weak cluster.

# Structure: how the text is built.

[[sign]]
id = "pt-modifier-load"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Loads nouns with adjectives and intensifiers, in longer and rarer words than people use, with fewer verbs and pronouns."
instead = "Keep the adjective that tells something; let a verb, a number or a name carry the rest."
strength = "weak"
flags = "Uma iniciativa extraordinariamente ambiciosa e profundamente inovadora para uma feira tradicional, acolhedora e singular."
passes = "A associação pede duas bancas novas para a feira de domingo e um toldo para quando chove."
sources = [
  { source = "andrade-2026-portuguese", where = "3.1, Tabela 4: intensifying adverbs and adjectives among the most distinctive machine terms; 3.2: 2.39 against 2.17 syllables a word; 3.3: more adjectives, fewer verbs and pronouns; Sabiá-3 against people's fake news", seen = 2026-11-09 },
  { source = "resende-castilho-2026-style", where = "3.1: GPT-4o's Brazilian original denser in content words (0.540 against 0.485) and in rarer ones", seen = 2026-11-09 },
]

[[sign]]
id = "pt-even-sentences"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Keeps sentences close to one length, where people mix short ones with long ones."
instead = "Let a short sentence follow a long one where the thought needs it."
strength = "weak"
flags = "O armazém fecha às seis da tarde. As entregas chegam sempre de manhã. O inventário faz-se ao fim do mês. A equipa tem agora oito pessoas."
passes = "O armazém fecha às seis. As entregas chegam de manhã, quase sempre antes das nove, e o inventário faz-se no último sábado do mês, com a equipa toda, que agora são oito."
sources = [
  { source = "andrade-2026-portuguese", where = "3.2, Tabela 5: syllables a sentence vary far more in people's texts (standard deviation 32.97 against 9.93); 3.4, Tabela 8: so do rules a sentence", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 6 Ritmo e estrutura, commit a4b596e6f8b0", seen = 2026-11-09 },
]

[[sign]]
id = "pt-stacked-connectors"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Opens sentence after sentence with ademais, adicionalmente, além disso or outrossim; one of them is ordinary Portuguese."
instead = "Join the facts with e or também, or let their order carry the link."
strength = "weak"
flags = "A cantina passa a abrir às sete. Adicionalmente, há sopa ao jantar. Outrossim, o menu fica mais barato. Além disso, já se paga com cartão."
passes = "A cantina passa a abrir às sete, com sopa ao jantar e um menu mais barato, e já se paga com cartão."
sources = [
  { source = "humanizer-pt-br", where = "patterns/conectivo-empilhado.yaml, commit a18e130ad39e", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 3 Transições e conectores, commit a4b596e6f8b0", seen = 2026-11-09 },
  { source = "wikipedia-pt", where = "Indícios que não funcionam: a lone connector is a weak sign, revision 73274816", seen = 2026-11-09 },
