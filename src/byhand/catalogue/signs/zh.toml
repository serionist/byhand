]

[[sign]]
id = "zh-connective-stacking"
category = "structure"
kinds = ["post"]
models = "any"
what = "Starts sentence after sentence with 此外, 然而, 与此同时 or 因此, where the order already links them."
instead = "Drop most of them; keep one only where it carries a turn or a cause."
strength = "weak"
flags = "此外，团队规模扩大了。然而，成本随之上升。与此同时，交付周期变长。因此，策略需要调整。"
passes = "团队扩了一倍，成本跟着涨，交付也慢了，得换个做法。"
sources = [
  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/structures.md.txt, 23 连词过密, commit 9b91ed9464b9", seen = 2026-11-07 },
