  { source = "wikipedia-zh", where = "排比句, revision 95337857", seen = 2026-11-07 },
]

[[sign]]
id = "any-false-range"
category = "structure"
kinds = ["any"]
models = "any"
what = "Writes 'from X to Y' with two things that sit on no real scale."
instead = "Name the items, or keep only the one you mean."
strength = "weak"
flags = "The exhibition spans everything from ancient pottery to the hopes of tomorrow."
passes = "The bus runs from Leeds to York every hour."
sources = [
  { source = "wikipedia-de", where = "Falsche Erweiterung, revision 271721424", seen = 2026-11-07 },
