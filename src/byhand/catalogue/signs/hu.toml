# Hungarian's signs. A sign here cites a source that covers Hungarian; the shape of a sign is in `any.toml`. Hungarian
# is written with spaces, so `validate` wraps a sign's terms in `\b`: a term is a stem with its suffixes (`átfogó\w*`).
# A term list, a group of plain words in a check or term, and a list of examples run in alphabetical order, accents and
# case ignored: our own order, never a source's (the maintainer, #28). Hungarian's own
# typography is a person's, never a sign: „…” quotes, straight quotes, the spaced short dash (–). Checks run
# case-insensitive, so a sign about capitals (Title Case, Ön and ön) is for the model's read. The measured signs rest on
# counts in Hun_ai_test, a 2024 corpus of instruction answers, not work mail, so each is weak; the one check that counts
# alone is an inflection error a native speaker doesn't make (the maintainer, #4). `tests/test_office_hu.py` holds plain work
# mail, chat, minutes and reports against them.

# Formatting.

[[sign]]
id = "hu-em-dash"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Sets off a clause with the long English dash (—), which Hungarian typography doesn't use."
instead = "Use brackets, commas, full stops or the spaced short dash (–)."
strength = "weak"
# Text on both sides, so a rule of dashes under a signature is no clause; and nothing after a comma or a full stop, so a
# price written 4500,— Ft is none either.
check = '[^\s—.,] ?— ?[^\s—]'
flags = "Három jelentkező maradt — mindhárman debreceniek."
passes = "Három jelentkező maradt – mindhárman debreceniek."
sources = [
  { source = "hun-ai-test", where = "mszny_test_final.csv, our count of this check per 100,000 characters, human then AI: 0.9 (10 of 1,000 texts) and 5.4 (36 of 1,000), commit c7c387679336", seen = 2026-11-08 },
  { source = "humanizer-hu", where = "SKILL.md, 8. Gondolatjel mint univerzális kötőelem, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 4", seen = 2026-11-08 },
]

[[sign]]
id = "hu-english-quotes"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Quotes with English curly marks (“…”); Hungarian opens low and closes high („…”), and plain text uses straight quotes."
instead = "Write „…”, or straight quotes where the tool gives them."
strength = "weak"
# Opens high on the left mark; Hungarian's own quote opens low, so „…” and "…" never match.
check = '“[^”„\n]{1,120}”'
flags = "A tárgysorba írd be, hogy “Leltár 2025”, különben a szűrő nem találja meg."
passes = "A tárgysorba írd be, hogy „Leltár 2025”, különben a szűrő nem találja meg."
sources = [
  { source = "humanizer-hu", where = "SKILL.md, 21. Tipográfiai idézőjelek, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 13", seen = 2026-11-08 },
]

[[sign]]
id = "hu-title-case-headings"
category = "formatting"
kinds = ["document", "deck", "post"]
models = "any"
what = "Capitalises every word of a bold label or a heading, as English titles do; Hungarian capitalises only proper names and the first word."
instead = "Capitalise names and the first word: **Szabadságolási rend decemberre:**"
strength = "weak"
flags = "**Szabadságolási Rend Decemberre:**"
passes = "**Szabadságolási rend decemberre:**"
sources = [
  { source = "humanizer-hu", where = "SKILL.md, 20. Dekoratív címsorok, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 10", seen = 2026-11-08 },
]

# Structure: how the text is built. All but the tacked-on participle are for the model's own read.

[[sign]]
id = "hu-address-switching"
category = "structure"
kinds = ["any"]
models = "any"
what = "Changes how it speaks to the reader partway through one text: Ön and ön mixed, or Ön and te."
instead = "Keep the form the text opens with; where it is unclear, take the one the reader last used with you."
strength = "usual"
flags = "Köszönöm, hogy ilyen gyorsan válaszoltál! Mikor lenne Önnek alkalmas egy rövid hívás?"
passes = "Köszönöm, hogy ilyen gyorsan válaszoltál! Mikor lenne neked alkalmas egy rövid hívás?"
sources = [
  { source = "humanizer-hu", where = "SKILL.md, Megszólítás and 26. Tegezés és magázás keveredése, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 6", seen = 2026-11-08 },
]

[[sign]]
id = "hu-explicit-subject-repeat"
category = "structure"
kinds = ["document", "email"]
models = "any"
what = "Spells out a subject the verb's ending already names (én, mi, ő) or a noun nothing has displaced, sentence after sentence, as English must; it reads as translated."
instead = "Any of: a pronoun once; leaving out the subject the verb's ending carries; one sentence where two share it. Never a synonym in its place."
strength = "weak"
flags = "Én átnéztem a szerződést. Én a 4. pontot módosítanám."
passes = "Átnéztem a szerződést. A 4. pontot módosítanám."
sources = [
  { source = "humanizer-hu", where = "SKILL.md, 7. Ismétlődő mondatkezdés, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 15", seen = 2026-11-08 },
]

[[sign]]
id = "hu-parenthetical-gloss"
category = "structure"
kinds = ["document", "email"]
models = "any"
what = "Puts a term's translation in brackets beside it, English after Hungarian or the reverse, for a reader who knows the word."
instead = "Use the word the team uses, once, with no gloss."
strength = "weak"
flags = "A lekérdezés (query) eredményét a gyorsítótárba (cache) írjuk, a naplót (log) hetente ürítjük."
passes = "A lekérdezés eredményét a cache-be írjuk, a logot hetente ürítjük."
sources = [
  { source = "humanizer-hu", where = "SKILL.md, Zárójel, commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 16", seen = 2026-11-08 },
]

[[sign]]
id = "hu-tacked-on-participle"
category = "structure"
kinds = ["any"]
models = "any"
what = "Tacks a -va/-ve participle onto a finished sentence after a comma, to say what the fact secures, serves or reflects."
instead = "End on the fact; if what it secures matters, give that its own sentence and its own subject."
strength = "weak"
# A comma, then the participle with the object it governs: an accusative after biztosítva and elősegítve, -hoz/-hez/-höz
# after hozzájárulva, an abstract noun after tükrözve, as mirroring an icon is plain work talk. "A szállás biztosítva."
# has no comma, "biztosítva lesz a fizetés" no object, and "biztosítva a kivetítő" a subject: all pass.
check = ',\s+(?:ezzel is\s+|így\s+)?(?:(?:biztosítva|elősegítve)\s+az?\s+(?:[^\s,.!?]+\s+){0,3}[^\s,.!?]*[aáeéiíjloóöősuúüűyz]t|hozzájárulva\s+az?\s+(?:[^\s,.!?]+\s+){0,3}[^\s,.!?]+h[eoö]z|tükrözve\s+az?\s+(?:[^\s,.!?]+\s+){0,3}(?:ambíció|elkötelezettség|elköteleződés|elv|érték|fontosság|hagyomány|identitás|jelentőség|küldetés|kultúr|szándék|szellemiség|törekvés|vízió)\w*)\b'
flags = "Az új parkolórendet hétfőtől vezetjük be, elősegítve a vendégek gyorsabb érkezését."
passes = "Az új parkolórendet hétfőtől vezetjük be. A vendégek így hamarabb beérnek."
sources = [
  { source = "hun-ai-test", where = "mszny_test_final.csv, our count of this check: 2 of 1,000 human texts and none of 1,000 AI texts, commit c7c387679336", seen = 2026-11-08 },
  { source = "humanizer-hu", where = "SKILL.md, 15. Felületes határozói igenevek (-va/-ve), commit 3b021d28638c", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, the two any signs; a weak Hungarian sign, the maintainer's call in review round 2", seen = 2026-11-08 },
]

# Words and phrases.

[[sign]]
id = "hu-hyphenated-case-ending"
category = "word"
kinds = ["any"]
# Every model the source measured did it; Gemma 3 and chatPuli did too, and have no family here.
models = [
  { family = "gemini", from = "2.5" },
  { family = "grok", from = "4" },
  { family = "llama", from = "3.3" },
  { family = "mistral", from = "3.1" },
  { family = "qwen", from = "3" },
]
what = "Joins a case ending to a Hungarian name that ends in a or e with a hyphen and no long vowel (Anna-val), which a native speaker doesn't write."
instead = "Join the ending to the name and lengthen its last vowel: Annával, Bencének, Nyíregyházán."
strength = "usual"
# A closed list of common Hungarian names and towns ending in a or e. A foreign or product name (Jira-ban, Teams-en),
# which people do hyphenate, is never matched; nor is a double name (Anna-Mária) or the question particle (Anna-e).
# Kata is left out: KATA, the tax, is rightly hyphenated (KATA-ból); Éva needs its accent, so EVA, the other tax, passes.
check = '\b(?:andrea|anna|attila|békéscsaba|béla|bence|csaba|dóra|emese|erika|éva|gabriella|gyula|hanna|ilona|imre|júlia|krisztina|lilla|luca|mária|nóra|nyíregyháza|petra|réka|tatabánya|viktória|zita|zsófia)-(?:b[ae]n?|b[óő]l|é|ék|ért|h[eo]z|ig|ként|n|n[ae]k|n[áé]l|r[ae]|r[óő]l|t|t[óő]l|v[ae]l)\b'
flags = "Csütörtökön Zsófia-val nézem át a szerződést, a végleges változatot Bence-nek küldöm."
passes = "Csütörtökön Zsófiával nézem át a szerződést, a végleges változatot Bencének küldöm."
sources = [
  { source = "novak-2026-morphology", where = "MSZNY 2026, pp. 47 and 54-55: the extra hyphen, an error class in every model measured, and appendix tables 4 to 6", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 5", seen = 2026-11-08 },
]

[[sign]]
id = "hu-place-name-suffix"
category = "structure"
kinds = ["any"]
models = [
  { family = "gemini", from = "2.5" },
  { family = "grok", from = "4" },
  { family = "llama", from = "3.3" },
  { family = "mistral", from = "3.1" },
  { family = "qwen", from = "3" },
]
what = "Says a thing is in a town that takes -en, -on or -ön with -ban or -ben instead (Szegedben for Szegeden), which a native speaker doesn't write."
instead = "Use the town's own ending: Budapesten, Kecskeméten, Miskolcon, Pécsen, Szegeden. Leave alone what is right: a club's, a county's or a hotel's name (Hilton Budapestben, Jász-Nagykun-Szolnokban), a verb that takes -ban (csalódtam Budapestben), and the town's other endings (Győrön keresztül)."
strength = "usual"
# For the model's read only (the maintainer, #28's review round 2): a check fired on a hotel's, a club's or a county's
# name and on a verb that takes -ban/-ben, all right Hungarian, and only the model can tell them apart.
flags = "A tavaszi vásár Kecskemétben lesz, az őszi Miskolcban."
passes = "A tavaszi vásár Kecskeméten lesz, az őszi Miskolcon."
sources = [
  { source = "novak-2026-morphology", where = "MSZNY 2026, appendix tables 4 to 6: the wrong place suffix, in every model measured; pp. 43-44, control contexts where the place ending is a verb's argument", seen = 2026-11-08 },
  { source = "maintainer-hu", where = "issuecomment-6719155663, row 9", seen = 2026-11-08 },
]

