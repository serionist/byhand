[[sign]]
id = "any-ai-self-reference"
category = "artefact"
kinds = ["any"]
models = "any"
what = "Says in the text that a language model or a named chatbot wrote it."
instead = "Delete it and write as the author."
strength = "strong"
# Arabic: the role and the lack humanizer-ar names, together, opening a clause (كمساعد ذكاء اصطناعي، لا أملك القدرة
# على), then what a model says it lacks (إبداء رأي, التنبؤ, الوصول إلى الإنترنت, تصفح). A person's verdict on a tool
# passes: "كمساعد ذكاء اصطناعي، لا أملك القدرة على تقييمه بعد", as does "نستخدمه كمساعد ذكاء اصطناعي، لا كبديل" (#58's
# review, F2).
check.ar = '(?:^|[!,.:;?،؛؟]\s?|\bو?لكن[،,]? )\W*كمساعد ذكاء اصطناعي[،,]?\s?لا أملك القدرة على (?:إبداء|التنبؤ|الوصول إلى ال[إا]نترنت|تصفح)'
check.de = 'als (?:ein |eine )?(?:großes sprachmodell|ki|ki-assistent|ki-modell|ki-sprachmodell|künstliche intelligenz|sprachmodell),? (?:besitze|bin|darf|habe|kann|verfüge) ich (?:\w+ ){0,2}(?:keine[nrs]?|nicht)\b'
check.en = 'as an ai language model|as a large language model'
# Spanish: only the role the source shows, como (gran) modelo de lenguaje, opening a clause, then what a model says it
# lacks (no tengo acceso, no puedo verificar). "Como IA" and "como asistente de IA" are left out: people say them of the
# tools they use ("como IA no tengo acceso a ninguna en el trabajo", "como asistente de IA, no como sustituto", "como
# IA, no puedo pedirle más"), #53's review, rounds 1 to 4.
check.es = '(?:^|[,.;:!?¡¿]\s?|\bembargo,? |\bpero |\bque )\W*como (?:un )?(?:gran )?modelo de lenguaje(?: de ia)?(?: (?:cread|desarrollad|entrenad)o por \w+)?,?\s?(?:yo )?no (?:cuento con|dispongo de|me es posible|poseo|puedo (?:acceder|ayudar\w*|comprobar|firmar|garantizar|navegar|predecir\w*|proporcionar|verificar)|soy capaz|tengo (?:acceso|creencias|emociones|experiencias|la capacidad|opini(?:ón|ones)|preferencias|sentimientos|un cuerpo))\b'
# French: only the role a model gives itself, followed by its "je"; "en tant qu'assistante de direction, je" is a
# person's job.
check.fr = '''en tant qu(?:['’]|e )\s?(?:assistant (?:conversationnel|d['’]ia|ia|virtuel)|grand modèle de langage|ia|intelligence artificielle|modèle de langage),\s?je\b'''
# Italian: three roles humanizer-it names (come modello di intelligenza artificiale, in qualità di IA, in quanto IA),
# opening a clause, then the one lack an Italian source shows, non ho accesso (avoid-ai-writing-multilingual). A
# person's "come responsabile IA, non ho accesso", "in qualità di referente IA, non ho accesso" and a tool's third
# person ("Copilot, in quanto IA, non ha accesso") pass. In quanto intelligenza artificiale is in no Italian source.
check.it = '(?:^|[,.;:!?]\s?|\bma )\W*(?:come modello di intelligenza artificiale|in qualità di ia|in quanto ia),?\s?non ho accesso\b'
# Portuguese by the Spanish rule: como or enquanto (um, grande) modelo de linguagem, opening a clause, then what a model
# says it lacks.
check.pt = '(?:^|[,.;:!?]\s?|\bentanto,? |\bmas |\bporém,? |\bque )\W*(?:como|enquanto) (?:um )?(?:grande )?modelo de linguagem(?: de ia)?(?: (?:criad|desenvolvid|treinad)o (?:pel[ao]|por) \w+)?,?\s?(?:eu )?não (?:consigo (?:aceder|acessar|navegar|verificar)|disponho|me é possível|possuo|posso (?:aceder|acessar|acrescentar|ajudar\w*|assinar|confirmar|fornecer|garantir|navegar|oferecer|prever|verificar)|sou capaz|tenho (?:acesso|crenças|emoções|experiências|opini(?:ão|ões)|preferências|sentimentos|um corpo))\b'
# The Chinese words of two scripts are one class each, here and in any-assistant-preamble, so one form reads both
# scripts (#63).
check.zh = '作[为為]一位[机機]器人|[内內]容由豆包|作[为為](?:一[个個名位])?\s?(?:ai|人工智[慧能])\s?(?:助[手理]|[语語]言模型)[，,]\s?我(?:可以|[无無]法|[不会會将將没沒并並只很的]|建[议議]|需要|理解)'
flags = "As an AI language model, I have no view on the rota."
passes = "As a language teacher, I can't mark this, but here are some options."
sources = [
  { source = "wikipedia-en", where = "Prompt refusal, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "introduction, Eindeutige Indikatoren: a note in the text that an AI wrote it, revision 271721424", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "資訊時效或來源限制相關的免責聲明, revision 95337857", seen = 2026-11-07 },
