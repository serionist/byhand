# The signs of every language. A sign here needs sources in at least two languages, a translated page counting as its
# language; an artefact with a `check` needs one, as a tool's string looks the same in every language. An `any` sign has
# no `terms`: a word's edge differs between languages, so it writes a `check`.
#
# [[sign]]
# id = "any-rule-of-three"
# category = "structure"        # word, phrase, structure, formatting, layout or artefact
# kinds = ["any"]               # message, email, post, document, deck, sheet, or any
# models = "any"                # or [{ family = "claude", from = "3", to = "4.6" }]: versions in quotes. No `to` holds
#                               # every later version; `to = "5"` holds the whole 5 series, `to = "5.0"` stops at 5.0
# what = "What the text does, in our own words."
# instead = "What a person writes instead."
# strength = "usual"            # strong, usual or weak
# check = "^- \\*\\*"           # optional: a regular expression, case-insensitive, `^` and `$` at each line
# flags = "An invented text the sign flags."
# passes = "A human text it passes."
# sources = [{ source = "wikipedia-en", where = "section, revision 1234567890", seen = 2026-11-07 }]

# Structure: how the text is built. Most have no `check`, as only the model's own read can find them.

[[sign]]
id = "any-generic-over-specific"
category = "structure"
kinds = ["any"]
models = "any"
what = "Trades a telling detail for praise that would suit anyone."
instead = "Keep the detail that fits only this subject: the name, number, date or event."
strength = "usual"
flags = "Maria was a visionary leader whose dedication transformed the local business community."
passes = "Maria ran the hardware shop on Mill Road for 31 years and lent tools to half the street."
sources = [
  { source = "wikipedia-en", where = "Content, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "忽略細節, revision 95337857", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Введение, revision 156024043", seen = 2026-11-07 },
]

[[sign]]
id = "any-significance-inflation"
category = "structure"
kinds = ["any"]
models = "any"
what = "Claims an ordinary fact marks a turning point, a legacy or a wider trend, even one it admits is minor."
instead = "State the fact; say what changed only if you can name the change."
strength = "usual"
flags = "With its new bus timetable, the town steps into a chapter that will shape generations to come."
passes = "The new bus timetable adds a 7:40 service, so the early shift can get in on time."
sources = [
  { source = "wikipedia-en", where = "Undue emphasis on significance, legacy, and broader trends, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "Sprache und Tonfall, revision 271721424", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Чрезмерный акцент на символизме и важности, revision 156024043", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "過度強調重要性、歷史影響、宏觀趨勢, revision 95337857", seen = 2026-11-07 },
]

[[sign]]
id = "any-coverage-name-drop"
category = "structure"
kinds = ["any"]
models = "any"
what = "Proves importance by listing who covered the subject, not what they said."
instead = "Report what a source says; name it where that helps the reader."
strength = "usual"
flags = "Profiles in several national papers and trade magazines attest to the studio's rising reputation."
passes = "Wired ran a piece in May on her battery work, and two labs have since repeated the test."
sources = [
  { source = "wikipedia-en", where = "Canned emphasis on notability, attribution, and media coverage, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "過度強調關注度、歸屬、媒體報導, revision 95337857", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Чрезмерный акцент на известности и освещении в СМИ, revision 156024043", seen = 2026-11-07 },
]

[[sign]]
id = "any-over-attribution"
category = "structure"
kinds = ["document"]
models = "any"
what = "Narrates what a record lists or identifies where the fact could stand alone."
instead = "State the fact; attribute only what someone could dispute."
strength = "weak"
flags = "Companies House lists Anna Lind as a director of the firm, and the register identifies her as its founder."
passes = "Anna Lind founded the firm and is still a director; Companies House has her date of birth wrong."
sources = [
  { source = "wikipedia-en", where = "Undue emphasis on identification by primary or tertiary sources, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-fr", where = "Contenu, revision 240703969", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Чрезмерный акцент на известности и освещении в СМИ, revision 156024043", seen = 2026-11-07 },
]

[[sign]]
id = "any-tacked-on-analysis"
category = "structure"
kinds = ["any"]
models = "any"
what = "Ends a fact on a clause saying what it shows, or has the fact itself highlight or underline something."
