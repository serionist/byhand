# language together, with a code's script variants merged into its base code (pa_Arab into pa). Names are CLDR's
# English name, or ISO 639-3's where CLDR has none; `native` is CLDR's name of the language in itself, left out where
# CLDR has no locale for it. `spaces = false` marks a language written without spaces between words.

