[[sign]]
id = "any-assistant-closing-offer"
category = "artefact"
kinds = ["document"]
models = "any"
what = "Keeps the chatbot's sign-off under a document: a hope that it helped, or an offer to do more."
instead = "Delete the line; end with the document."
strength = "strong"
check.de = '^\W*(?:gibt es noch etwas, (?:bei dem|womit) ich (?:dir |ihnen )?(?:noch )?(?:behilflich sein|helfen) kann|(?:möchten sie|möchtest du),? dass ich (?:daraus|den entwurf|den text|dies|diesen entwurf|diesen text|es|ihn) (?:noch )?(?:\w+ ){0,4}(?:anpasse|ausbaue|ergänze|erstelle|erweitere|formuliere|kürze|kürzer fasse|mache|überarbeite|umformatiere|umformuliere|umschreibe|umwandle)\b|soll ich (?:den entwurf|den text|dies|diesen entwurf|diesen text|es|ihn) (?:noch )?(?:\w+ ){0,4}(?:anpassen|ausbauen|ergänzen|erweitern|formulieren|kürzen|kürzer fassen|überarbeiten|umformatieren|umformulieren|umschreiben|umwandeln)\b|soll ich daraus (?:noch )?(?:\w+ ){0,4}(?:erstellen|machen)\b|lass(?:en sie|t)? mich wissen,? (?:falls|ob|wenn) ich (?:\w+ ){0,5}(?:ändern|anpassen|ergänzen|erweitern|kürzen|kürzer fassen|überarbeiten|umformulieren|umschreiben|umwandeln) soll)'
check.en = '''^\W*(?:would you like me to (?:convert|expand|reformat|turn) this|let me know if you(?:['’]d| would) like me to (?:adjust|expand|refine|revise|tweak)|is there anything else you(?:['’]d| would) like me to)'''
check.es = '^\W*(?:quieres|te gustaría) que (?:(?:amplíe|desarrolle) (?:algún|alguna|esta|este)|(?:la|lo|te lo) (?:acorte|adapte|amplíe|desarrolle|resuma))\b'
check.pt = '^\W*(?:gostaria que eu (?:[ao] )?(?:adaptasse|ampliasse|desenvolvesse|detalhasse|encurtasse|expandisse|resumisse|transformasse)\b|(?:quer|queres) que eu (?:[ao] )?(?:adapte|amplie|desenvolva|detalhe|encurte|expanda|resuma|transforme)\b)'
check.ru = '^\W*сообщите мне, если хотите, чтобы (?:я (?:адаптировал|дополнил|доработал|изменил|переписал|расширил|сократил)|(?:документ|статья|текст) был\w* (?:расширен|сокращ[её]н|доработан|переписан|адаптирован))'
# Vietnamese, from the line vietnamese-humanizer tells its model not to add (Nếu bạn cần, tôi có thể…): an offer to
# rework the text, as English's: the verb, then the text (đoạn, bài viết, nội dung, văn bản) as the whole object,
# ending there or at a word that goes on about the rework (này, cho, theo, thành, với, để, xuống, trên, hoặc). A person's offer of data or of another document (gửi thêm số liệu gốc, bổ sung
# thêm số liệu, chỉnh sửa lại hợp đồng, chỉnh sửa nội dung hợp đồng, viết lại văn bản đề nghị) passes.
check.vi = '^\W*nếu bạn cần,? tôi có thể (?:chỉnh sửa|mở rộng|rút gọn|viết lại) (?:lại )?(?:bài viết|nội dung|văn bản|đoạn(?: văn)?)(?: (?:cho|hoặc|này|thành|theo|trên|với|xuống|để)\b|\s*[!,.:;?]|\s*$)'
flags = "The committee meets each spring.\n\nWould you like me to expand this into a one-page handout?"
passes = "The committee meets each spring.\n\nWould you like me to bring the projector, or will Sam?"
sources = [
  { source = "wikipedia-en", where = "Collaborative communication, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "Kollaborative Kommunikation, revision 271721424", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Имитация диалога, revision 156024043", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "協作式溝通訊息, revision 95337857", seen = 2026-11-07 },
  { source = "humanizer-es", where = "skills/humanizer-es/SKILL.md, A6; evals/contestants/omel/patterns.md, 20, commit ac2a31be1a71", seen = 2026-11-09 },
  { source = "wikipedia-pt", where = "Conversas com o usuário, revision 73274816", seen = 2026-11-09 },
  { source = "vietnamese-humanizer", where = "skills/humanizer-vi/SKILL.md, Đầu ra, commit 2fd7dd05cbd9", seen = 2026-11-09 },
]

[[sign]]
id = "any-unfilled-placeholder"
category = "artefact"
kinds = ["any"]
models = "any"
what = "Leaves a fill-in slot in the text: a bracketed name, a URL stub, a date of XX."
instead = "Fill it in or cut it before you send."
strength = "usual"
# A slot left in a person's own template fires too, on purpose: it is unfilled. Markdown link text, [your account](...),
# is no slot: a bracket with ( after it passes, in every branch.
check.any = '\[(?:add|company|describe|insert|recipient|your)\b[^\]\n]*\](?:[^(]|$)|\b(?:insert|paste)_[a-z0-9_]+_here\b|20\d\d-xx-xx'
check.de = '\[(?:ihre?n?|dein(?:e|en)?)\b[^\]\n]*\](?:[^(]|$)|\[[^\]\n]{1,40} (?:einfügen|eintragen|ergänzen)\](?:[^(]|$)'
# Spanish likewise: [Tu nombre], [Nombre del cliente], not "[por confirmar]".
check.es = '\[(?:insert(?:a|ar|e)|nombre (?:de la|del) (?:cliente|destinatari[ao]|empresa)|su (?:cargo|empresa|nombre)|tu (?:cargo|correo|empresa|nombre|teléfono))\b[^\]\n]*\](?:[^(]|$)'
# French: the slots a model leaves for the sender, not "[date à confirmer]" or "[à compléter]" in a person's notes.
check.fr = '''\[(?:insérer|nom (?:de l['’]entreprise|de la société|du destinataire)|vos coordonnées|votre (?:entreprise|fonction|nom|poste|prénom|société))\b[^\]\n]*\](?:[^(]|$)'''
check.ja = '[\[［【]ここに[^\]］】\n]{0,15}(?:入れ|入力|挿入|記入|貼)[^\]］】\n]{0,6}[\]］】](?:[^(]|$)'
# Portuguese likewise: [Seu nome], [O teu nome], [Nome do cliente], not "[a confirmar]".
check.pt = '\[(?:descreva|inserir:? \w+|insira:? \w+|nome d[aeo] (?:artista|cliente|destinatári[ao]|empresa)|(?:o )?(?:seu|teu) (?:cargo|contacto|contato|e-?mail|endereço|nome|telefone)|(?:a )?(?:sua|tua) (?:empresa|função))\b[^\]\n]*\](?:[^(]|$)'
check.ru = '\[(?:имя|ваш\w*|вставьте|опишите|укажите)\b[^\]\n]*\](?:[^(]|$)'
flags = "Thanks again, and see you on Friday.\n\n[Your Name]"
passes = "Thanks again, and see you on Friday.\n\nMarta"
sources = [
  { source = "wikipedia-en", where = "Phrasal templates and placeholder text, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "Platzhaltertext, revision 271721424", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "В обсуждениях, revision 156024043", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "短語模板與占位符文字, revision 95337857", seen = 2026-11-07 },
  { source = "yomiyasu", where = "references/slop-catalog.md, 6 仮置きの残り, commit 8394e099486a", seen = 2026-11-07 },
  { source = "slopcheck-fr", where = "src/slopcheck/packs/fr-signatures.toml, placeholder, commit 74c6b9685694", seen = 2026-11-08 },
  { source = "humanizer-es", where = "evals/dev/raw: [Tu nombre] 8 times in 30 model texts, [Nombre del cliente] and [Tu empresa] too, commit ac2a31be1a71", seen = 2026-11-09 },
  { source = "wikipedia-pt", where = "Modelos de frases e campos por preencher, revision 73274816", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 5 Formatação, Marcas de ferramenta, commit a4b596e6f8b0", seen = 2026-11-09 },
]

