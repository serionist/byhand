[[sign]]
id = "any-assistant-preamble"
category = "artefact"
kinds = ["email", "document", "post"]
models = "any"
what = "Keeps the chatbot's opening line above the text, such as an eager yes and 'here is'."
instead = "Delete the line; start with the text itself."
strength = "strong"
# Arabic, by English's rule, below: بالطبع, then إليك a reworked version of the reader's text (نسخة محسّنة من رسالتك); a
# person's "بالطبع، إليك نسخة من رسالتك:" (a copy) or "إليك نسخة معدلة من العقد:" passes.
check.ar = '^\W*بالطبع\s?[!,.،]+\s?إليك (?:ال)?(?:صيغة|نسخة) (?:ال)?(?:أقصر|أكثر \w+|أوضح|محسّ?نة|مختصرة|معدّ?لة|منقّ?حة) (?:ل|من )(?:بريد|خطاب|رد|رسالت|سيرت|مقال|منشور|نص)كم?\b[^.!?؟\n]*:\s*$'
check.de = '^\W*(?:natürlich|sicherlich|selbstverständlich|(?:sehr )?gerne)[!,] hier ist (?:eine?|die|der|das) (?:\w+ )?(?:überarbeitete|verbesserte|umformulierte|geglättete|\w+ere)[rs]? (?:entwurf|fassung|text|version) (?:(?-i:Ihre[sr])|deine[sr]|eure[sr])\b[^.!?\n]*:\s*$|^\W*(?:natürlich|sicherlich|selbstverständlich|(?:sehr )?gerne)[!,] hier ist (?:(?-i:Ihre?)|deine?|eure?) (?:\w+ )?(?:überarbeitete|verbesserte|umformulierte|geglättete|\w+ere)[rs]? (?:entwurf|fassung|text|version)\b[^.!?\n]*:\s*$'
# Every language follows English's rule (#26): a reworked version of the reader's text (of your email, your rewritten
# post), or a register word after more or less, bare or of a text (a more formal version), or a text in a register for
# the reader to send (a polite email you can send). The text is the head noun: "your email signature" and "a more
# neutral version of the logo" pass; after the text, a comma, a dash, a bracket or a linking word lets the line go on
# ("of your email incorporating your feedback"), and after a register version anything but "of" and an object that is no
# text. A person's more recent, newer or shorter version of the deck passes, as does a revised version of the contract,
# a rewrite of the intro, and "your revised offer letter" from HR: a letter is the reader's text only as a cover letter.
# The opener is an eager yes or an offer to help, then a mark, a comma or a dash, then here's, here is or below is; or a
# bare below is (#37). Each still needs the reader's text or a register word, so a person's "Below is the revised quote,
# as agreed:" passes. A text to send keeps the old opener alone: "Below is a friendly message you can share with your
# team:" is a person's template. The branches that end on the reader's text share its noun list and the linking words
# after it, written once (#63).
check.en = '''^\W*(?:(?:absolutely|certainly|happy to help|i['’]d be happy to help|of course|sure|sure thing)(?:[!,.]+ | ?[-–—] ?)(?:below is|here(?:['’]s| is))|below is) (?:(?:(?:(?:a|an|the) (?:[\w-]+,? ){0,2}(?:casual|clearer|concise|condensed|conversational|corrected|courteous|crisper|diplomatic|edited|empathetic|enhanced|formal|friendlier|friendly|improved|informal|less \w+|longer|more \w+|neutral|polished|polite|professional|proofread|punchier|refined|rephrased|respectful|revised|reworded|reworked|rewritten|shortened|shorter|simpler|streamlined|tactful|tightened|tighter|warmer) (?:draft|version)|a rewrite) of (?:your (?:[\w-]+ )?(?:announcement|article|bio|caption|cover letter|cv|e-?mail|essay|intro|introduction|mail|message|paragraph|personal statement|post|reply|response|r[eé]sum[eé]|sentence|speech|text|tweet)|the (?:[\w-]+ )?(?:announcement|article|bio|caption|cover letter|cv|e-?mail|essay|intro|introduction|mail|message|paragraph|personal statement|post|reply|response|r[eé]sum[eé]|sentence|speech|text|tweet) you (?:provided|shared|wrote))|(?:your (?:[\w-]+ )?(?:enhanced|improved|polished|refined|rephrased|revised|reworded|reworked|rewritten|shortened|streamlined|tightened)|(?:a|an) (?:[\w-]+,? (?:and )?){0,2}(?:less|more) (?:casual|concise|conversational|courteous|diplomatic|empathetic|formal|friendly|informal|neutral|polite|professional|respectful|tactful)(?:,? (?:and )?[\w-]+)? (?:draft|version) of (?:that|the|this|your)) (?:[\w-]+ )?(?:announcement|article|bio|caption|cover letter|cv|e-?mail|essay|intro|introduction|mail|message|paragraph|personal statement|post|reply|response|r[eé]sum[eé]|sentence|speech|text|tweet))(?:(?:,| [-–—(]| (?:above|below|that)\b| (?:about|addressed|addressing|aimed|along|as|based|focusing|following|for|from|in|incorporating|keeping|making|now|on|per|ready|reflecting|so|suitable|tailored|to|using|which|while|with|without|you) )[^.!?\n]*)?\s*:\s*$|(?:a|an) (?:[\w-]+,? (?:and )?){0,2}(?:less|more) (?:casual|concise|conversational|courteous|diplomatic|empathetic|formal|friendly|informal|neutral|polite|professional|respectful|tactful)(?:,? (?:and )?[\w-]+)? (?:draft|version)(?:(?:,| [^o.!?\n]| o[^f])[^.!?\n]*| of (?:it|that|the above|this))?\s*:\s*$)|^\W*(?:absolutely|certainly|of course|sure)[!,.]+ here(?:['’]s| is) (?:a|an) (?:[\w-]+,? ){0,2}(?:casual|concise|conversational|courteous|diplomatic|empathetic|formal|friendly|informal|neutral|polite|professional|respectful|tactful),? (?:[\w-]+ )?(?:announcement|e-?mail|letter|message|post|reply) (?:that )?you can (?:copy|post|send|share|use)\b[^.!?\n]*:\s*$'''
# Spanish, by the same rule: an eager yes, then aquí tienes the reader's text reworked (tu correo corregido, una versión
# más formal de su mensaje); a person's "aquí tienes la versión corregida del presupuesto" passes.
check.es = '^\W*(?:claro|claro que sí|con gusto|desde luego|por supuesto)\s?[!,.]+\s?aquí (?:está|tiene|tienes) (?:(?:su|tu) (?:anuncio|carta de presentación|correo|currículum|cv|e-?mail|mail|mensaje|post|publicación|texto) (?:corregid|mejorad|reescrit|reformulad|revisad)[ao]|(?:la|una) (?:\w+ )?versión (?:corregida|más (?:amable|breve|cercana|clara|concisa|corta|formal|profesional)|mejorada|pulida|reescrita|reformulada|revisada) de (?:su|tu) (?:anuncio|carta de presentación|correo|currículum|cv|e-?mail|mail|mensaje|post|publicación|texto))\b[^.!?\n]*:\s*$'
# French, by the rule the Chinese and Russian forms follow: only a reworked version that names the reader's text (de
# votre e-mail, de ton message); a person returning a client's devis or courrier passes (#24's review). Its alternations
# run in alphabetical order, as fr.toml's header says.
check.fr = '^\W*(?:absolument|avec plaisir|bien sûr|certainement)\s?[!,.]+\s?voici (?:(?:ton|votre) (?:compte rendu|courriel|cv|e-?mail|mail|message|post|rapport|texte) (?:amélioré|reformulé|retravaillé|révisé)|une (?:\w+ )?version (?:améliorée|peaufinée|plus (?:chaleureuse|claire|concise|courte|engageante|fluide|formelle|percutante|professionnelle)(?: et plus \w+)?|reformulée|retravaillée|révisée) de (?:ta|ton|votre) (?:annonce|compte rendu|courriel|cv|e-?mail|lettre|mail|message|post|publication|rapport|texte))\b[^.!?\n]*:\s*$'
# Indonesian, from humanizer-indonesia's D11 (Tentu, berikut draf revisinya), by the same rule: the revision names the
# reader's text (draf revisi email Anda); a person's "Tentu, berikut draf revisinya, Pak:" or "… draf revisi
# kontraknya:" passes.
check.id = '^\W*tentu\s?[!,.]+\s?berikut (?:adalah )?(?:draf|versi) revisi (?:dari )?(?:email|pesan|surat|teks|tulisan) (?:anda|kamu)\b[^.!?\n]*:\s*$'
# Italian likewise, from the openers the three Italian lists name (Certo!, Certamente!, Con piacere!) and their Ecco
# a te…: "Certo! Ecco la versione corretta del preventivo:" passes, as does a concessive "Certo, …".
check.it = '^\W*(?:assolutamente|certamente|certo|con piacere)\s?[!,.]+\s?ecco (?:a te )?(?:la|una) (?:\w+ )?versione (?:corretta|migliorata|più (?:breve|chiara|concisa|formale|professionale)|riformulata|rivista) d(?:el|ella) (?:sua|suo|tua|tuo) (?:annuncio|curriculum|cv|e-?mail|lettera|mail|messaggio|post|testo)\b[^.!?\n]*:\s*$'
# Portuguese likewise: "Claro! Aqui está a versão corrigida do orçamento:" passes.
check.pt = '^\W*(?:certamente|claro|claro que sim|com certeza)\s?[!,.]+\s?(?:aqui (?:está|tem|tens)|eis) (?:(?:[ao] )?(?:seu|sua|teu|tua) (?:anúncio|carta de apresentação|currículo|cv|e-?mail|mensagem|post|publicação|resposta|texto) (?:corrigid|melhorad|reescrit|reformulad|revisad|revist)[ao]|(?:a|uma) (?:\w+ )?versão (?:corrigida|mais (?:clara|concisa|curta|formal|profissional)(?: e \w+)?|melhorada|reescrita|reformulada|revisada|revista) d[aoe] (?:seu|sua|teu|tua) (?:anúncio|carta de apresentação|currículo|cv|e-?mail|mensagem|post|publicação|resposta|texto))\b[^.!?\n]*:\s*$'
# The Russian participles share their ending, written once (#63).
check.ru = '^\W*(?:безусловно|конечно)! вот (?:(?:ваш|тво)\w* (?:исправле|переработа|улучше|отредактирова|сокращ[её])нн\w+ (?:абзац|письмо|пост|резюме|сообщение|текст)\b|(?:\w+ )?(?:исправле|переработа|улучше|отредактирова|сокращ[её])нн\w+ (?:вариант|версия|редакция|текст) (?:ваш|тво)\w+ (?:абзац|объявлени|письм|пост|резюме|сообщени|стать|текст)\w*|(?:\w+ )?более (?:вежлив|делов|дружелюбн|кратк|лаконичн|мягк|нейтральн|неформальн|официальн|профессиональн|формальн)\w* (?:вариант|версия)\b)[^.!?\n]*:\s*$'
# Turkish likewise, from humanizer-tr's Elbette! and İşte …: (23), the reader's text reworked or in a register word:
# "Elbette, işte sözleşmenin imzalı hâli:" and "Elbette, işte e-postanızın orijinal hali:" pass.
check.tr = '^\W*elbette\s?[!,.]+\s?[iİ]şte (?:(?:e-?posta|mesaj[ıI]|yaz[ıI])n[ıI]z[ıI]n|metn[iİ]n[iİ]z[iİ]n) (?:daha (?:k[ıI]sa|naz[iİ]k|net|profesyonel|resm[iİ]|sade|sam[iİ]m[iİ]) (?:b[iİ]r )?|düzelt[iİ]lm[iİ]ş |(?:yen[iİ]den )?düzenlenm[iİ]ş |gözden geç[iİ]r[iİ]lm[iİ]ş |[iİ]y[iİ]leşt[iİ]r[iİ]lm[iİ]ş |k[ıI]salt[ıI]lm[ıI]ş |yen[iİ]den yaz[ıI]lm[ıI]ş )(?:hal[iİ]|hâl[iİ]|sürümü|vers[iİ]yonu):\s*$'
# Vietnamese, from the line vietnamese-humanizer tells its model not to add: Dưới đây là phiên bản, then the reader's
# text, called bạn as a model calls the user, right after của and ending the line (của email của bạn:); a person's
# "phiên bản cuối của hợp đồng", a text of anh's or chị's, or a version made from the reader's mail or sent to it (theo
# email của bạn, theo nội dung email của bạn, gửi vào email của bạn), passes (#62's review, F1). With a second của such
# a line fires (theo nội dung của email của bạn), as does a converted copy (phiên bản PDF của văn bản của bạn):
# accepted, as narrowing the gap loses model lines with long modifiers (round 2, F5). A colleague who calls the reader
# bạn and returns their text reworked fires, the cost #24 accepts. It names three texts and no eager yes: the source's
# line names neither.
check.vi = '^\W*dưới đây là phiên bản [^:\n]*của (?:email|tin nhắn|văn bản) của bạn:\s*$'
# The Chinese words of two scripts are one class each (#63).
check.zh = '^\W*[当當]然(?:可以)?[!！]\s*(?:下面|以下)[为是為](?:[为為][你您]|根[据據][你您]的(?:意[见見]|要求))?(?:[优優]化|修改|改[写寫]|[润潤]色)[后後]的[文版]本[:：]\s*$'
flags = "Certainly! Here is a polished version of your announcement:"
passes = "Sure! Here's the link to the slides from yesterday."
sources = [
  { source = "wikipedia-en", where = "Collaborative communication, revision 1384165696", seen = 2026-11-07 },
