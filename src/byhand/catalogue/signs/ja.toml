  { term = '熱量', instead = "say how much work went in" },
  { term = '腹落ち', instead = "納得" },
  { term = '温度感', instead = "how keen they are" },
  { term = '手触り', instead = "describe it" },
  { term = '泥臭(?:い|さ)', instead = "name the hands-on work" },
