# Phrases.

[[sign]]
id = "pt-closing-cheer"
category = "phrase"
kinds = ["post", "document"]
models = "any"
what = "Ends on a cheer that says nothing: o céu é o limite, o futuro é promissor, só o tempo dirá."
instead = "End on the next step or the last fact."
strength = "weak"
terms = [
  { term = '''o céu é o limite''', instead = "cut" },
  { term = '''o futuro é promissor''', instead = "cut" },
  { term = '''o melhor ainda está por vir''', instead = "name what comes next" },
  { term = '''só o tempo dirá''', instead = "cut" },
]
flags = "A loja nova abre na sexta, com café para todos. O futuro é promissor!"
passes = "A loja nova abre na sexta às nove, com café para quem chegar cedo."
sources = [
  { source = "humanizer-pt-br", where = "patterns/fechamento-motivacional.yaml, commit a18e130ad39e", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 1 Léxico, Nível 1A; 4 Aberturas e fechos, Fecho genérico, commit a4b596e6f8b0", seen = 2026-11-09 },
]

[[sign]]
id = "pt-filler-hinges"
category = "phrase"
kinds = ["post", "document"]
models = "any"
what = "Hangs a sentence on a hinge that only announces it: cabe ressaltar que, é importante destacar que, vale ressaltar que."
instead = "Cut the hinge; the sentence says the same without it."
strength = "weak"
terms = [
  { term = '''cabe (?:destacar|ressaltar|salientar) que''', instead = "cut" },
  { term = '''é (?:essencial|fundamental|importante) (?:destacar|mencionar|ressaltar|salientar|sublinhar) que''', instead = "cut" },
  { term = '''importa realçar que''', instead = "cut" },
  { term = '''vale (?:destacar|mencionar|ressaltar) que''', instead = "cut" },
  { term = '''vale a pena (?:destacar|mencionar|referir|ressaltar) que''', instead = "cut" },
]
flags = "Sobre a mudança de escritório, cabe ressaltar que as chaves novas chegam na segunda."
passes = "Sobre a mudança de escritório: as chaves novas chegam na segunda e ficam com a Joana."
sources = [
  { source = "humanizer-pt-br", where = "patterns/importante-destacar.yaml and vale-ressaltar.yaml, commit a18e130ad39e", seen = 2026-11-09 },
  { source = "evitar-escrita-ia", where = "SKILL.md, 3 Transições e conectores, commit a4b596e6f8b0", seen = 2026-11-09 },
]

[[sign]]
