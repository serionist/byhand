# Formatting: what the text looks like on the page.

[[sign]]
id = "any-bold-overuse"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Bolds many phrases in running text, as a sales sheet would."
instead = "Bold almost nothing; put the key point first in the sentence."
strength = "usual"
flags = "Our **new policy** gives **all staff** more **flexibility** on **working hours**."
passes = "Our new policy lets all staff choose their hours. **It starts on 1 May.**"
sources = [
  { source = "wikipedia-en-style", where = "Overuse of boldface, revision 1382924605", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "Übermäßige Verwendung von Fettschrift, revision 271721424", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "濫用粗體, revision 95337857", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Чрезмерное использование жирного шрифта, revision 156024043", seen = 2026-11-07 },
  { source = "wikipedia-fr", where = "Mise en page, typographie, revision 240703969", seen = 2026-11-07 },
]

[[sign]]
id = "any-bold-lead-in-list"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Starts item after item in a list with a bold label and a colon, or numbers bold paragraph titles."
instead = "Write plain items or a sentence; keep labels where a reader scans for them."
strength = "weak"
check = '^\s*(?:[-*•–]|\d+[.)])\s+\*\*[^*\n]+(?::\*\*|\*\*\s*[:：])|^\*\*\d+[.、]'
flags = "- **Speed:** Pages load faster.\n- **Cost:** Hosting is cheaper."
passes = "- Pages load faster\n- Hosting is cheaper"
sources = [
  { source = "wikipedia-en-style", where = "Inline-header vertical lists, revision 1382924605", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Вертикальные списки с заголовками, revision 156024043", seen = 2026-11-07 },
  { source = "wikipedia-zh", where = "列表式行文; 不成節且賦編號的段落, revision 95337857", seen = 2026-11-07 },
  { source = "sun-2025-idiosyncrasies", where = "arXiv v2, 3.2 Markdown Formatting: ChatGPT bolds each key point of a list", seen = 2026-11-07 },
]

