[[sign]]
id = "ja-copy-fragments"
category = "structure"
kinds = ["any"]
models = "any"
what = "Writes prose like ad copy: clipped sentences stacked for effect, a noun after a lone comma, a list with no verb."
instead = "Write the sentence out, with its verb."
strength = "weak"
check = '''(?:^|[。！？])(?:[^。！？、\s「」]{1,5}[。！]){3}'''
flags = "軽い。速い。迷わない。それが今度の家計簿アプリ。"
passes = "軽くて速く、操作に迷うことがない家計簿アプリです。"
sources = [
