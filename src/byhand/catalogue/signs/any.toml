[[sign]]
id = "any-negative-parallelism"
category = "structure"
kinds = ["any"]
models = "any"
what = "Raises a claim nobody made in order to correct it: not this but that, or not just this."
instead = "State the point itself; keep the negation only when someone really holds the view you reject."
strength = "usual"
flags = "This is not just a software update. It is a new way of working."
passes = "This update fixes the login bug. It doesn't touch billing."
