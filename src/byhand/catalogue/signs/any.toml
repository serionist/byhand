]

[[sign]]
id = "any-closing-summary"
category = "structure"
kinds = ["any"]
models = "any"
what = "Ends a section or the whole text by restating it, often under a heading such as Conclusion."
instead = "Stop when the point is made; end on the last new thing."
strength = "weak"
check = '^\W*(?:in conclusion|in summary|zusammenfassend|подводя итог|в заключение)\b'
flags = "In conclusion, the plan offers clear benefits for everyone involved."
passes = "So that's the plan. Tell me if Friday doesn't work."
sources = [
  { source = "wikipedia-en", where = "Section summaries, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "Abschnitts-Zusammenfassungen; Fazit, revision 271721424", seen = 2026-11-07 },
  { source = "wikipedia-ru", where = "Отдельный раздел/подраздел для краткого содержания написанного, revision 156024043", seen = 2026-11-07 },
  { source = "wikipedia-fr", where = "Structure générale, revision 240703969", seen = 2026-11-07 },
]

[[sign]]
id = "any-circular-argument"
category = "structure"
kinds = ["any"]
models = "any"
what = "Says the same point again in other words, adding nothing new."
instead = "Let each paragraph add a fact or a step; cut the ones that do not."
strength = "usual"
flags = "The reform matters greatly. It has had a significant effect. Its importance is widely felt across the sector."
passes = "The reform cut fees by 8%. Enrolment rose the next year, mostly among part-time students."
sources = [
  { source = "wikipedia-zh", where = "重複表述與論證缺乏推進, revision 95337857", seen = 2026-11-07 },
  { source = "wikipedia-fr", where = "Structure générale, revision 240703969", seen = 2026-11-07 },
]

[[sign]]
id = "any-synonym-cycling"
