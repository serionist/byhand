# Russian's signs. A sign here cites a source that covers Russian; the shape of a sign is in `any.toml`. A term is a
# stem and its endings, wrapped in `\b`: Russian inflects, so each term is written to find its case and verb forms, and
# [её] stands where people write either letter.
#
# Russian typography is no sign: the тире is standard punctuation (between subject and predicate, in dialogue) and
# «ёлочки» are the normal quotes. No sign here or in `any.toml` reads either, and `tests/test_office_ru.py` holds it.
# Office register (канцелярит) is how many people write mail, minutes, reports and official letters: no sign that a
# script counts reads it, and the one that names it is for the model's read of a post or an article.

# Formatting.

[[sign]]
id = "ru-title-case-headings"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Capitalises every word of a heading, an English habit; Russian capitalises the first word and names only. Headings set in capitals throughout, as contracts use, are not this."
instead = "Capitalise the first word and proper names; leave и, в, на and the rest small."
strength = "usual"
# Case matters here alone, so the part that reads capitals turns case-insensitivity off. It needs a Markdown heading
# whose words each start with a capital and go on in lower case, so a contract's ПРАВА И ОБЯЗАННОСТИ passes, and a
# capitalised preposition or conjunction inside, which no name has. A bold line isn't read: people set a signature,
# Отдел Продаж И Маркетинга, that way. Nor С: people capitalise «С Новым Годом». A small и between capitalised words
# (Ранняя Жизнь и Образование) is left to the model's read, as two names joined by и look the same.
check = '''^#{1,6} +(?-i:[А-ЯЁ][а-яё-]+(?: [А-ЯЁ][а-яё-]+)* (?:Без|В|Во|Для|До|За|И|Из|Или|К|На|О|Об|От|По|При|Через)(?: [А-ЯЁ][а-яё-]+)+)\s*$'''
flags = "## Сроки И Бюджет Проекта"
passes = "## Сроки и бюджет проекта"
sources = [
  { source = "wikipedia-ru", where = "Заглавная буква, revision 156024043", seen = 2026-11-08 },
  { source = "humanizer-ru", where = "references/patterns.md, 21; SKILL.md, Стиль, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-math-signs"
category = "formatting"
# Not mail or chat, where a quick «A > B» or «vs» is a person's shorthand.
kinds = ["post", "document"]
models = "any"
what = "Puts =, >, < or vs between words in running prose."
instead = "Write the relation out in words."
strength = "weak"
check = '''[а-яё]+ (?:[=><≈]|vs\.?) [а-яё]+'''
flags = "Для нас удобство > цена, поэтому берём второй тариф."
passes = "Для нас удобство важнее цены, поэтому берём второй тариф."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 23, commit ff990df404f7", seen = 2026-11-08 },
]

# Structure: how the text is built. Most have no `check`, as only the model's own read can find them.

[[sign]]
id = "ru-office-register"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Writes a post or an article in office register: осуществлять, является, данный, в целях, strings of genitives. Letters, minutes, contracts and reports use it by custom; leave them."
instead = "Use the plain verb and этот, and say who does what."
strength = "weak"
flags = "В целях осуществления контроля качества данной продукции нами было принято решение о проведении проверки."
passes = "Мы решили проверить эту партию."
sources = [
  { source = "slop-gate", where = "rules/russian.json, commit f78d5cbee0dc", seen = 2026-11-08 },
  { source = "humanizer-ru", where = "references/patterns.md, 1 to 3; SKILL.md, description: legal and academic text exempt, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-dangling-participle"
category = "structure"
kinds = ["any"]
models = "any"
what = "Starts on a деепричастие whose doer never turns up as the subject."
instead = "Name the doer as the subject."
strength = "weak"
flags = "Проверив накладные, недостача оказалась меньше."
passes = "Проверив накладные, Света нашла недостачу поменьше."
sources = [
  { source = "wikipedia-ru", where = "Бесконечные (и часто нелогичные) деепричастные обороты, revision 156024043", seen = 2026-11-08 },
  { source = "humanizer-ru", where = "references/patterns.md, 35, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-verb-echo"
category = "structure"
kinds = ["any"]
models = "any"
what = "Reuses the last sentence's verb for the next sentence's new subject."
instead = "Give each subject the verb that fits it; repeat one only for emphasis."
strength = "weak"
flags = "Первый тариф даёт скидку на связь. Второй тариф даёт бесплатный роуминг."
passes = "Первый тариф даёт скидку на связь, а на втором роуминг бесплатный."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 33, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-paragraph-stack"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Links paragraphs only with кроме того or также, so none grows out of the one before."
instead = "Let each paragraph answer, extend or turn on the one before it."
strength = "weak"
flags = "Весной мы открыли пункт выдачи в Химках.\n\nТакже курьеры теперь работают по субботам.\n\nКроме того, в магазине появилась примерочная."
passes = "Весной мы открыли пункт выдачи в Химках.\n\nОн забрал половину заказов у курьеров, и в мае мы перевели двоих из них на субботние смены."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 34, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-chopped-fragments"
category = "structure"
# Not mail or chat, where «Без сахара. Без молока.» is an order for coffee.
kinds = ["post", "document"]
models = "any"
what = "Breaks a point into a run of verbless scraps for effect."
instead = "Write one full sentence with its verb."
strength = "weak"
check = '''(?:^|[.!?]\s+)(?:без|ни|никаких|ноль)\s[^.!?\n]{1,30}[.!]\s+(?:без|ни|никаких|ноль)\s[^.!?\n]{1,30}[.!]'''
flags = "Перешли на электронные пропуска. Без бумажек. Без очереди у охраны."
passes = "Перешли на электронные пропуска, и у охраны больше не стоят с бумажками."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 27; SKILL.md, Жёсткие запреты, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-poster-maxim"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Puts a claim as a two-noun maxim; the dash in it is plain Russian, the maxim is the sign."
instead = "Say what actually happened, with a number if there is one."
strength = "weak"
flags = "Отзывы — это новая реклама для маленькой пекарни."
passes = "Половина новых покупателей пришла в пекарню по отзывам на картах."
sources = [
  { source = "humanizer-ru", where = "references/patterns.md, 28, commit ff990df404f7", seen = 2026-11-08 },
]

# Words and phrases of every model. Each term counts as one phrase toward the weak rule, however its endings vary.

[[sign]]
id = "ru-significance-phrases"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Hangs symbolism and turning points on ordinary facts with set phrases."
instead = "Say what happened; name the change only if you can."
strength = "weak"
terms = [
  { term = '(?:выступа|служ|явля)\w* (?:живым |ярким )?(?:напоминанием|символом)', instead = "say what it shows" },
  { term = 'знамен(?:ова|у)\w*', instead = "начинается, or give the date" },
  { term = 'неизгладим\w+ след\w*', instead = "say what changed" },
  { term = 'непоколебим\w*', instead = "cut" },
  { term = 'поворотн\w+ (?:момент|пункт|этап)\w*', instead = "give the date and the change" },
  { term = 'символизир\w*', instead = "say who reads it so" },
]
flags = "Открытие новой проходной знаменует поворотный момент для всего завода."
passes = "С понедельника открывается новая проходная, и утренняя очередь на заводе станет короче."
sources = [
  { source = "wikipedia-ru", where = "Чрезмерный акцент на символизме и важности, revision 156024043", seen = 2026-11-08 },
  { source = "humanizer-ru", where = "references/patterns.md, 6 and 7, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-tacked-on-participles"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Ends a sentence on a participle clause that draws a moral from the fact."
instead = "Stop at the fact, or give the cause in a sentence of its own."
strength = "weak"
terms = [
  { term = 'демонстрируя', instead = "cut" },
  { term = 'отражая', instead = "name the cause" },
  { term = 'подч[её]ркивая', instead = "cut, or say who stresses it" },
  { term = 'способствуя', instead = "say what it changed" },
]
flags = "Выручка магазина выросла на 4%, подчёркивая верность покупателей и демонстрируя силу сети."
passes = "Выручка магазина выросла на 4%: в октябре открыли вторую кассу."
sources = [
  { source = "wikipedia-ru", where = "Поверхностный анализ, revision 156024043", seen = 2026-11-08 },
  { source = "humanizer-ru", where = "references/patterns.md, 8, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-didactic-phrases"
category = "phrase"
kinds = ["any"]
models = "any"
# Not «следует отметить», «стоит отметить», «нельзя не отметить» or a bare «важно отметить»: the stock openers of a
# person's report.
what = "Tells the reader what is worth noting before saying it."
instead = "Say it; the reader decides what matters."
strength = "weak"
terms = [
  { term = '(?:крайне|критически) важно (?:отметить|подч[её]ркнуть)', instead = "cut" },
  { term = 'стоит обратить внимание на то', instead = "cut" },
]
flags = "Крайне важно отметить, что парковка закрыта, и стоит обратить внимание на то, что пропуска выдаёт охрана."
passes = "Парковку закрыли до среды, пропуск возьмите у охраны."
sources = [
  { source = "wikipedia-ru", where = "Дидактические и редакционные оговорки, revision 156024043", seen = 2026-11-08 },
  { source = "humanizer-ru", where = "references/patterns.md, 11, commit ff990df404f7", seen = 2026-11-08 },
]

[[sign]]
id = "ru-vague-authority"
category = "phrase"
kinds = ["any"]
models = "any"
# Not «по мнению экспертов», «эксперты отмечают» or «ряд экспертов считает»: a person's report says them too.
what = "Leans on unnamed experts and analysts."
instead = "Name the person or the study, or drop the claim."
strength = "weak"
terms = [
  { term = 'исследователи утверждают', instead = "name them" },
  { term = 'некоторые критики', instead = "name them" },
]
flags = "Некоторые критики сомневаются в новом тарифе, а исследователи утверждают обратное."
passes = "Ирина из бухгалтерии посчитала: на новом тарифе мы экономим 3 000 рублей в месяц."
sources = [
  { source = "wikipedia-ru", where = "Обтекаемые формулировки, revision 156024043", seen = 2026-11-08 },
