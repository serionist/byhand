# Plain Finnish work text, invented, for tests/test_office_fi.py; it lives here, not in the test, as ruff reads the
# short dash as a confusable hyphen, and Finnish writes it in every range and as its dash.
#
# Office and official Finnish run on what finnish-humanizer would rewrite: the passive, light verbs (suorittaa
# tarkistuksen, tehdä päätös), officialese (edellä mainittu, kyseinen, mikäli), "tulee" for must, and set phrases in
# mail (Pahoittelemme häiriötä, Terveisin, Ystävällisin terveisin). People write "ei ole vain X, vaan myös Y" before a
# fact, lists of three that are three things, "Haasteista huolimatta" before a number, "On syytä huomata", "Hyvä
# kysymys" and "Viimeisimpien tietojeni mukaan" in their own voice, the particles the source misses (-han, -pa, kyllä,
# vaan), and English laced through office Finnish (deadline, feedback). Chat is often typed with no ä or ö (paase,
# siirtaa). They are a person's, never a sign.
#
# Finnish typography is how people write: the same closing mark on both sides of a quote (”…”), » » and straight quotes,
# the spaced short dash as a dash and to open a line of dialogue, now and then the long dash a phone or a Mac makes, the
# unspaced short dash in a range, a spaced hyphen as a dash, the decimal comma, a space between thousands, % after a
# space, dates as 9.11.2026 and klo 14.00.

