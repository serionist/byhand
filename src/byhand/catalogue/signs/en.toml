[[sign]]
id = "en-even-sentences"
category = "structure"
kinds = ["any"]
models = "any"
what = "Writes sentence after sentence of one length and one shape."
instead = "Let length follow the thought, some short and some long."
strength = "weak"
flags = "The team met on Monday. The plan was reviewed in detail. The budget was then approved. The next steps were agreed."
