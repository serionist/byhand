[[sign]]
id = "zh-era-opener"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Spends its first sentence on the age we live in, or on how fast a field is growing, before the subject appears."
instead = "Begin with what happened, when, and to whom."
strength = "weak"
check = '''^\W*(?:在[当當]今|在[这這][个個][^。，\n]{1,12}的[时時]代|[随隨][着著][^。，\n]{1,16}的(?:不[断斷]|快速|[飞飛]速|迅速|蓬勃)?(?:发展|發展))'''
flags = "随着跨境电商的快速发展，仓储行业正在经历深刻变革。"
passes = "上个月客服电话多了四成，我们打算先招两个人顶上。"
sources = [
  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/phrases-zh.md.txt, 开场套话, commit 9b91ed9464b9", seen = 2026-11-07 },
  { source = "speak-human-tw", where = "references/patterns.md, 21 公式化開場, commit 89b96e24fcfd", seen = 2026-11-07 },
]

[[sign]]
