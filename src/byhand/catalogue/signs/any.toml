strength = "usual"
check = 'specific details (?:are|remain) (?:limited|scarce)|in the provided (?:sources|search results)|in den bereitgestellten (?:quellen|suchergebnissen)|в предоставленных (?:источниках|результатах)'
flags = "Specific details remain scarce, yet the firm probably shaped trade in the region."
passes = "I couldn't find the 2019 accounts, so I've left that year out."
sources = [
  { source = "wikipedia-en", where = "Hedging disclaimers about source availability and recommended usage, revision 1384165696", seen = 2026-11-07 },
