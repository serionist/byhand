]

[[sign]]
id = "ru-challenges-formula"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Ends on a stock pair: difficulties named in general, then a bright future."
instead = "Name the problem and what is being done about it, or stop."
strength = "weak"
terms = [
  { term = 'будущее выглядит (?:ярким|светлым|многообещающ\w*)', instead = "give the next step" },
  { term = 'несмотря на (?:все|существующие|эти) (?:вызовы|трудности)', instead = "cut" },
  { term = 'продолжа\w+ процветать', instead = "give a number" },
  { term = '(?:сталкива|столкну)\w+ с (?:целым )?рядом вызов\w*', instead = "name the problem" },
]
flags = "Типография сталкивается с рядом вызовов, но будущее выглядит многообещающим."
passes = "Кафе пережило ремонт дороги; выручка в октябре вернулась к прошлогодней."
