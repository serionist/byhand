[[sign]]
id = "any-knowledge-cutoff"
category = "artefact"
kinds = ["any"]
models = [{ family = "gpt", from = "3.5", to = "4" }]
what = "Warns that its knowledge stops at a training date."
instead = "Check the current fact, or give the date of your source."
strength = "strong"
check.de = 'stand meines letzten wissensupdates|bis zu meinem letzten (?:trainings|wissens)-?update'
check.en = '(?:as of|up to) my last (?:knowledge|training) update'
# The Spanish form needs the knowledge: "hasta mi última actualización del inventario", or "en marzo", is a person's.
check.es = 'hasta mi última actualización de conocimientos?\b'
check.fr = 'à la date de mes connaissances'
# The Italian form needs its date: "conoscenze aggiornate al corso HACCP" is a person's refresher course, and "fino al
# mio ultimo aggiornamento" is left out, as a person writes it of their own file.
check.it = 'secondo le mie conoscenze aggiornate a[dl]? (?:(?:agosto|aprile|dicembre|febbraio|gennaio|giugno|luglio|maggio|marzo|novembre|ottobre|settembre) (?:del )?)?\d{4}\b'
# The Portuguese one likewise: knowledge or training, in either variety's word for it, ending the phrase or before its
# date; "atualização de conhecimentos em suporte básico de vida" is a person's course.
check.pt = 'até (?:[aà] )?minha última ac?tualização de (?:conhecimentos?|treinamento|treino)(?:\s*[(,.:;—]|\s+(?:de |em (?:\w+ de )?|no \w+ de )\d{4}\b|\s*$)'
# The Russian forms need the moment of the update: «во время обновления моей базы данных» is a person's server.
check.ru = 'на момент моего обучения|момент (?:последнего )?обновления моей базы данных|мо[её] последнее обновление знаний'
flags = "As of my last knowledge update, the company had not announced a merger."
passes = "As of my last update on Tuesday, the shipment was still in Rotterdam."
