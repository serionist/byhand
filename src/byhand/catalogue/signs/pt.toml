# Portuguese's signs, for Brazil, Portugal and the rest alike: a variety is no sign of AI (wikipedia-pt says so), and a
# sign that held for one variety only would be left out. A sign here cites a source that covers Portuguese; the shape
# of a sign is in `any.toml`. A term is a regular-expression fragment, and `validate` wraps the list in `\b`, so a term
# starts and ends at a word's edge. Portuguese inflects for gender, number and person, so a term lists its forms.
#
# Order: every alternation, every term list and every list of examples in a `what` or `instead` runs in alphabetical
# order of its plain text, accents and case ignored, as in every language (tests/test_order.py).
#
# What these rest on: Andrade et al. 2026 measured Sabiá-3's Brazilian fake news against people's; Resende and
# Castilho 2026 measured GPT-4o's Brazilian story; evitar-escrita-ia (European) and humanizer-pt-br (Brazilian) list
# tells for a rewriting skill, with no evidence of their own: humanizer-pt-br's counts are of texts Grok was asked to
# fill with tells. So a sign from either rests on both, or on another source beside it, and lists only what a source
# names; a word English's lists translate (abrangente, crucial, robusto) or a phrase people use (mais do que nunca, no
# cenário atual) is left out, as Portuguese reports and papers are full of them. None measured work mail, and no native
# speaker has read these yet. So every Portuguese sign is weak until one does, and a sign that counts alone would have
# no pattern: the model reads for it. The Portuguese checks read posts and documents, but the dash, as the set phrases
# of mail (Fico à disposição, Qualquer dúvida, é só dizer, Sem mais para o momento) are a person's.
# A calque of English (a full stop after a list label, alavancar, endereçar um problema, Espero que esta mensagem o
# encontre bem, Title Case) is translationese, which people write too: no source measures models writing one more than
# people, so none has a sign. Brazilian forms in text for Portugal, or European ones in Brazil, are a variety, not a
# sign. Portuguese typography is no tell either: the travessão before dialogue and around a spaced aside, « » and “ ”.
# tests/test_office_pt.py holds plain mail, chat and reports from both varieties against every sign that counts alone,
# and against a weak cluster.

# Structure: how the text is built.

[[sign]]
id = "pt-false-contrast"
category = "structure"
kinds = ["post", "document"]
models = "any"
# any-negative-parallelism says what the habit is; this sign holds its Portuguese forms and their check. "Não só X,
# mas também Y" and "não se trata de X, mas de Y" are ordinary Portuguese and the check leaves them alone.
what = "The Portuguese form of a set-up contrast: não é apenas… é…, não é só… é…."
instead = "Say what the thing is or does, with a figure or an example; drop the foil."
strength = "weak"
check = '''\bnão (?:é|são) (?:apenas|só) [^.!?;:\n]{1,60}[,;:]\s*(?:é|são)\b'''
flags = "A biblioteca municipal não é apenas um sítio de livros, é a sala de estar da vila."
passes = "A biblioteca municipal não é só para sócios: qualquer morador pode requisitar livros ao sábado."
sources = [
  { source = "evitar-escrita-ia", where = "SKILL.md, 2 Sintaxe e construções, commit a4b596e6f8b0", seen = 2026-11-09 },
  { source = "wikipedia-pt", where = "Paralelismos negativos, revision 73274816", seen = 2026-11-09 },
]

[[sign]]
id = "pt-modifier-load"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Loads nouns with adjectives and intensifiers, in longer and rarer words than people use, with fewer verbs and pronouns."
instead = "Keep the adjective that tells something; let a verb, a number or a name carry the rest."
strength = "weak"
flags = "Uma iniciativa extraordinariamente ambiciosa e profundamente inovadora para uma feira tradicional, acolhedora e singular."
