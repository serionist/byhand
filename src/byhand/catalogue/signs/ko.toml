# Formatting.

[[sign]]
id = "ko-comma-after-ending"
category = "formatting"
kinds = ["any"]
models = "any"
what = "In sentence after sentence, a comma sits where -지만, -면서 or -는데 already joins two clauses."
instead = "Delete the comma; the clauses stay joined without it."
strength = "weak"
# A stem before the ending: 하지만, 그렇지만 and 그러면서 open a sentence, and a comma after them is ordinary.
check = '''(?:[^\s하렇]|\S하|[^\s그]렇)지만,|(?:[^\s러]|[^\s그]러)면서,|\S(?:는데|으며|하며),'''
flags = "가격은 올랐지만, 수요는 그대로였고 재고가 줄어들면서, 납기가 길어졌다."
passes = "가격은 올랐어요. 하지만, 주문은 그대로예요. 그러면서 납기만 일주일 늘었어요."
sources = [
  { source = "im-not-ai", where = "ai-tell-taxonomy.md, C-11 and C-12, commit b37e0206d31f", seen = 2026-11-07 },
  { source = "im-not-ai", where = "baseline.json, essay, ending_comma_rate, commit b37e0206d31f", seen = 2026-11-07 },
]

[[sign]]
id = "ko-scare-quotes"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Puts quotation marks round coined labels again and again, not round anything anyone said."
instead = "Keep quotation marks for words someone actually used; write your own terms bare."
strength = "weak"
flags = "이번 개편의 키워드는 '연결'이다. '현장 중심'의 문화 속에서 '작은 성공'을 쌓아 '함께 성장'하는 것이 목표다."
passes = "팀장님이 회의에서 \"이번 달은 무리하지 말자\"고 하셨어요. 그래서 마감은 다음 달로 미뤘어요."
sources = [
  { source = "im-not-ai", where = "ai-tell-taxonomy.md, J-2, commit b37e0206d31f", seen = 2026-11-07 },
  { source = "im-not-ai", where = "empirical-validation.md, J-2: 0 per 1,000 words in the default model runs against 11.36 for people, 26.89 when the task asks for quotes, commit b37e0206d31f", seen = 2026-11-07 },
]

[[sign]]
id = "ko-em-dash"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Sets off asides with em dashes, sentence after sentence."
instead = "Use a comma, brackets or a new sentence."
strength = "weak"
check = '—'
flags = "새 결재 시스템은 — 적어도 지금까지는 — 기대만큼 빠르지 않다."
passes = "새 결재 시스템은 아직 기대만큼 빠르지 않아요(적어도 지금까지는요)."
sources = [
  { source = "im-not-ai", where = "ai-tell-taxonomy.md, J-3, commit b37e0206d31f", seen = 2026-11-07 },
  { source = "slop-gate", where = "rules/punctuation.json, commit f78d5cbee0dc", seen = 2026-11-07 },
]

# Tied to a model family.

[[sign]]
id = "ko-gpt-2024-vocabulary"
category = "word"
kinds = ["any"]
# Lee et al. ran gpt-4o-mini and a Korean model of late 2024: both wrote these far above the human rate, while the 2026
# models wrote them near it. 조명하다 is not here: gpt-5.6-luna and Claude Sonnet 5 still write it above people (Table 7),
# so it is in ko-register-shift-vocabulary. Only GPT is a family here.
models = [{ family = "gpt", from = "4", to = "4" }]
what = "Uses the verbs of 2024 GPT models in Korean: contribute, explore, emphasise, an important role."
instead = "Use the plain verb, or say what was done."
strength = "weak"
terms = [
  { term = '기여(?:하|한|할|함|합|해|했)\w*', instead = "돕다" },
  { term = '탐구(?:하|한|할|함|합|해|했)\w*', instead = "알아보다" },
  { term = '강조(?:하|한|할|함|합|해|했)\w*', instead = "say it once" },
  { term = '중요한 역할\w*', instead = "say what it does" },
]
flags = "이 연구는 지역 축제가 공동체 회복에 중요한 역할을 한다는 점을 강조하며, 그 요인을 탐구한다."
passes = "이 연구는 지역 축제 다섯 곳을 다니며 주민 120명을 인터뷰했어요."
sources = [
  { source = "lee-2026-korean", where = "arXiv 2609.07447v1, 5.6 Positive control and Table 7: gpt-4o-mini drafts", seen = 2026-11-07 },
]

[[sign]]
id = "ko-gpt-meaning-wrap"
category = "phrase"
kinds = ["any"]
models = [{ family = "gpt", from = "5" }]
what = "Closes a summing-up sentence on 'which means that', ~다는 뜻이다."
instead = "End on the claim itself, with -다."
strength = "weak"
check = '''다는 (?:뜻|의미)(?:이다|입니다)'''
flags = "고객 문의의 절반이 배송 지연이라면, 물류 쪽 인원을 먼저 늘려야 한다는 뜻이다."
passes = "고객 문의 절반이 배송 지연이라서 물류팀에 한 명 더 배치하기로 했어요."
sources = [
  { source = "im-not-ai", where = "ai-tell-taxonomy.md, I-3, the ChatGPT variant of v1.3, commit b37e0206d31f", seen = 2026-11-07 },
]

[[sign]]
id = "ko-gemini-colon-headings"
category = "formatting"
kinds = ["document", "post"]
models = [{ family = "gemini", from = "2.5" }]
what = "Breaks heading after heading at a colon, a topic on the left and a catchline on the right."
instead = "Write the heading as what the section tells the reader, with no colon."
strength = "weak"
check = '''^#{1,6}\s+[^\n:]+:\s*\S'''
flags = "## 물류비: 오르는 운임, 흔들리는 마진"
passes = "## 물류비가 오른 이유"
sources = [
  { source = "im-not-ai", where = "ai-tell-taxonomy.md, C-10, round 3 on Gemini 2.5 Pro, commit b37e0206d31f", seen = 2026-11-07 },
]

[[sign]]
id = "ko-gemini-shift-slogan"
category = "phrase"
kinds = ["any"]
models = [{ family = "gemini", from = "2.5" }]
what = "Sums up a change as a slogan from one quoted label to another, 'X'에서 'Y'로."
instead = "Say what changed, for whom, and when."
strength = "weak"
check = '''['‘"“][^'’"”\n]{1,20}['’"”](?:에서|[을를] 넘어) ['‘"“][^'’"”\n]{1,20}['’"”](?:으로|로)'''
flags = "인사팀은 이제 '규정의 문지기'에서 '성장의 동반자'로 거듭나고 있다."
passes = "인사팀은 올해부터 채용과 교육을 같이 맡아요."
sources = [
  { source = "im-not-ai", where = "ai-tell-taxonomy.md, D-7, round 3 on Gemini 2.5 Pro, commit b37e0206d31f", seen = 2026-11-07 },
]
