[[sign]]
id = "zh-translationese"
category = "structure"
kinds = ["any"]
models = "any"
what = "Reads like English carried into Chinese: long chains of 的, stacked 被 passives, and frames like 对于……而言 or 基于."
instead = "Break the chain into short clauses with a subject, in the active voice."
strength = "weak"
flags = "这是一款被众多用户认为可以显著提高部门的沟通效率的软件。"
passes = "这个工具大家都说好用，开会时少了很多来回。"
sources = [
