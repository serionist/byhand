  { source = "wikipedia-fr", where = "Mise en page, typographie, revision 240703969", seen = 2026-11-08 },
  { source = "avoid-ai-writing-multilingual", where = "SKILL-FR.md, pattern 21, commit 4e5aa4c51230", seen = 2026-11-08 },
  { source = "slopcheck-fr", where = "src/slopcheck/packs/fr-signatures.toml, gabarit-anglais; typo-fr.toml, casse-titre, commit 74c6b9685694", seen = 2026-11-08 },
]

[[sign]]
id = "fr-hashtag-block"
category = "formatting"
kinds = ["post"]
models = "any"
what = "Closes a post with a run of broad tags that name a mood or a sector, not anything a reader would look up."
instead = "Let the post end on its last sentence."
strength = "weak"
check = '''(?:^|\s)#[^\W\d_]\w*(?:[ \t]+#[^\W\d_]\w*){3,}'''
flags = "On ouvre une deuxième boutique à Rennes en mai.\n\n#Commerce #Rennes #Croissance #Entrepreneuriat"
