sources = [
  { source = "russell-2025-detectors", where = "arXiv v2, Table 3, sentence structure", seen = 2026-11-07 },
  { source = "wikipedia-en", where = "High density of AI vocabulary words, GPT-6 era note, revision 1384165696", seen = 2026-11-07 },
]

# Tied to a model family.

[[sign]]
id = "en-em-dash"
category = "formatting"
kinds = ["any"]
# OpenAI suppressed them from GPT-5.1, and ChatGPT now uses fewer than professional writers; Claude alone still uses
# more, as Wikipedia reports The Economist of July 2026. No other family has a source yet.
models = [{ family = "gpt", from = "3.5", to = "5.0" }, { family = "claude", from = "3" }]
what = "Uses spaced em dashes as pivots, more than a person writing the same kind of text."
instead = "Use a comma, a colon, brackets or a full stop."
strength = "weak"
check = '\s—\s'
flags = "The launch is not late — it is on its own schedule."
passes = "The launch—already late—moved to May."
sources = [
  { source = "wikipedia-en", where = "Overuse of em dashes (2022 to September 2026), revision 1384165696", seen = 2026-11-07 },
]

[[sign]]
id = "en-claude-prompt-echo"
category = "phrase"
kinds = ["any"]
models = [{ family = "claude", from = "3.5" }]
what = "Opens by pointing back at the material it was given."
instead = "Start with the answer; name the document where the reader needs it."
strength = "weak"
terms = [
  { term = 'according to the (?:passage|text)', instead = "cut" },
  { term = 'based on the (?:passage|text)', instead = "cut" },
  { term = '''here['’]s a summary''', instead = "start with it" },
]
flags = "Based on the text, the supplier missed two deadlines."
passes = "According to the minutes, the supplier missed two deadlines."
sources = [
  { source = "sun-2025-idiosyncrasies", where = "arXiv v2, 3.1 Characteristic phrases, Figures 4 and 6, Claude 3.5 Sonnet", seen = 2026-11-07 },
]

