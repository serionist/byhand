# Arabic's signs, for Modern Standard Arabic and every dialect alike: a variety is no sign of AI, and a sign that held
# for one dialect only would be left out. A sign here cites a source that covers Arabic; the shape of a sign is in
# `any.toml`. A term is a regular-expression fragment, and `validate` wraps the list in `\b`, so a term starts and ends
# at a word's edge; a combining mark (a short vowel, shadda, tanween) is part of the word, as Grep reads it.
#
# Order: every alternation, every term list and every list of examples in a `what` or `instead` runs in alphabetical
# order of its plain text, marks and case ignored, as in every language (tests/test_order.py).
#
# What these rest on: al-Shaibani and Ahmed 2025 measured ALLaM, GPT-4, Jais and Llama against people in Arabic
# abstracts and reviews; Wang et al. 2026 asked annotators what told GPT-4o's and Qwen2's Arabic from people's;
# humanizer-ar lists Arabic tells for a rewriting skill, with no data of its own but al-Shaibani and Ahmed's. So a sign
# rests on one of the papers, or on humanizer-ar beside one. None measured work mail, and no native speaker has read
# these yet. So every Arabic sign is weak until one does, and a sign that counts alone would have no pattern: the
# model reads for it. The one Arabic check reads posts and documents only.
# Left out, as people write them in office Arabic and humanizer-ar alone lists them: its stock connectors (تجدر الإشارة
# إلى, علاوة على ذلك, في هذا السياق), its inflated phrases (حجر الزاوية, نقلة نوعية), تم with a verbal noun and the
# light verb قام ب, which formal Arabic and translation write too (a calque needs evidence that models write it more).
# Left out, as humanizer-ar's own tests found them to be a person's: partial diacritics (شكرًا, تُستخدم), long sentences
# joined by و (formal Arabic's median is 35 words), and the tatweel, which ends هـ after a Hijri year and which al-Shaibani
# and Ahmed strip from people's reviews. Western dashes and quotes and mixed digit systems rest on humanizer-ar alone.
# The frequent words al-Shaibani and Ahmed list beside الضوء (بشكل, تعزيز, منهجية, يمكن) are a field's or everyday
# words: ar-narrow-vocabulary holds the habit without them. Wang et al.'s other cues are in signs every language
# shares (any-generic-over-specific, any-raw-markdown), or rest on news alone: news cut into short sections, which the
# paper puts down partly to how the human texts were collected, and no English term or religious phrase.
# tests/test_office_ar.py holds plain mail, chat and reports in Modern Standard Arabic and in dialect against every sign
# that counts alone, and against a weak cluster.

# Structure: how the text is built.

[[sign]]
id = "ar-register-drift"
category = "structure"
kinds = ["message", "post"]
models = "any"
what = "In a text meant in one dialect, mixes in another dialect's forms, or slides back into standard Arabic for whole sentences."
instead = "Keep the dialect the text opens in; a standard term, a set phrase or a quote is how people write too."
strength = "weak"
flags = "ازيك يا كريم؟ أنا هتأخر شوية النهارده. وعليه، يُرجى إبلاغ الفريق بأن الاجتماع سيبدأ في تمام الساعة العاشرة."
passes = "ازيك يا كريم؟ أنا هتأخر شوية النهارده، قول للفريق إن الاجتماع الساعة عشرة."
sources = [
  { source = "humanizer-ar", where = "skills/humanizer-ar/SKILL.md, step 4; README.md, Known limitations, commit 5289d4a60aa5", seen = 2026-11-09 },
  { source = "wang-2026-human-detection", where = "D.1, Arabic Dialect Tweets: Qwen2 mixing dialects, which people rarely do, v3", seen = 2026-11-09 },
]

[[sign]]
id = "ar-narrow-vocabulary"
category = "structure"
kinds = ["post", "document"]
models = "any"
what = "Circles a few common words, repeating them more than people do, and uses fewer of a field's own terms, names and places."
instead = "Use the field's own term, the name and the place, and let a plain word come once."
strength = "weak"
flags = "يهدف المشروع إلى تطوير الخدمات في المدينة، ويسهم تطوير الخدمات في تطوير المدينة، مما يعزز أهمية المشروع وأهمية الخدمات."
passes = "ركّبت البلدية 40 حاوية في حي الروضة، ونقلت جمع النفايات في شارع الأمير سلطان إلى السادسة صباحًا."
sources = [
  { source = "al-shaibani-2025-arabic", where = "5.1.2, Table 4, Figure 2: each model's top words above 3,000 uses against under 2,000 in people's abstracts, a steeper long tail, and 40% of people's top words a field's or a region's; 5.2.2, Table 7, Figure 3: reviews, v2", seen = 2026-11-09 },
  { source = "humanizer-ar", where = "skills/humanizer-ar/references/patterns.md, 19 and 20, commit 5289d4a60aa5", seen = 2026-11-09 },
]

# Phrases.

[[sign]]
id = "ar-shed-light"
category = "phrase"
kinds = ["post", "document"]
models = "any"
what = "Says that a text sheds light on its subject (تسليط الضوء, يسلط الضوء على); one alone is ordinary Arabic, in news above all."
instead = "Say what it shows: the finding, the name or the number."
strength = "weak"
terms = [
  { term = '''(?:\w?[أتني]سلّ?ط\w*|\w?سلّ?ط(?:ت|نا|وا)?|\w?تسليط)(?: \w+){0,3} الضوء''', instead = "say what it shows" },
]
flags = "يسلط التقرير الضوء على مبيعات فرع جدة في الربع الثالث."
passes = "يعرض التقرير مبيعات فرع جدة في الربع الثالث: 1.2 مليون ريال، بزيادة 8%."
sources = [
  { source = "al-shaibani-2025-arabic", where = "5.1.2, Table 4: الضوء among the ten most frequent words of ALLaM's, GPT-4's and Llama's abstracts, and not of people's, v2", seen = 2026-11-09 },
  { source = "humanizer-ar", where = "skills/humanizer-ar/references/patterns.md, 4, commit 5289d4a60aa5", seen = 2026-11-09 },
]
