kinds = ["post", "document"]
models = "any"
what = "Leans on the words Spanish model prose favours: adéntrate, de vanguardia, fascinante, sinergia, sumérgete, vibrante. One alone is ordinary Spanish."
instead = "Use the plain word, or the fact the word stands in for."
strength = "weak"
terms = [
  { term = '''adéntrate''', instead = "cut" },
  { term = '''de vanguardia''', instead = "say what is new" },
  { term = '''fascinantes?''', instead = "say what is interesting" },
  { term = '''sinergias?''', instead = "say who does what together" },
  { term = '''sumérgete''', instead = "cut" },
  { term = '''vibrantes?''', instead = "lively, or the fact" },
]
flags = "Sumérgete en un barrio vibrante con una oferta cultural fascinante."
passes = "El barrio tiene dos teatros, un cine de verano y mercado los jueves."
sources = [
