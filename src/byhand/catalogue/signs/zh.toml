# Chinese signs. A sign here cites a Chinese source; the shape of a sign is in `any.toml`. Chinese is written without
# spaces, so `validate` joins a sign's terms with no word edge. A `zh-Hant` draft reads this file too, so a term covers
# both scripts where they differ ([综綜]).
#
# Most of these are weak: Chinese office writing uses many of the same phrases, and shuorenhua retired its own word
# lists in 2.5.0 for that reason. A weak sign counts only in a cluster.

# Words and phrases of every model.

[[sign]]
id = "zh-significance-words"
category = "word"
kinds = ["any"]
models = "any"
what = "Props up a plain fact with set words of significance, legacy and role."
instead = "Say what happened, to whom and when; drop the word if no fact stands behind it."
strength = "weak"
terms = [
  { term = '标志着|標誌著', instead = "say what changed" },
  { term = '见证了|見證了', instead = "say what happened" },
  { term = '奠定了?(?:坚实的?|堅實的?)?基[础礎]', instead = "say what it made possible" },
  { term = '不可磨[灭滅]', instead = "say what remains" },
  { term = '根植[于於]', instead = "comes from" },
  { term = '意[义義](?:重大|非凡)', instead = "say what it means" },
  { term = '至[关關]重要|[举舉]足[轻輕]重', instead = "say why it matters" },
  { term = '深[远遠]的?影[响響]', instead = "name the effect" },
  { term = '扮演[着著了]?[^。，\n]{0,10}角色', instead = "say what it does" },
  { term = '不[断斷](?:变化|演变|變化|演變)的格局', instead = "name the market" },
]
flags = "新仓库启用标志着物流部迈入新阶段，也为明年扩张奠定了基础。"
passes = "新仓库周一启用，比老仓库多放三千箱货，明年看情况再扩。"
sources = [
  { source = "wikipedia-zh", where = "語言、語法, revision 95337857", seen = 2026-11-07 },
  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/phrases-zh.md.txt, 渲染性强调, commit 9b91ed9464b9", seen = 2026-11-07 },
]

[[sign]]
id = "zh-stock-openers"
category = "phrase"
kinds = ["any"]
models = "any"
what = "Opens with a stock signpost that a point matters, or announces what comes next, instead of saying it."
instead = "Cut the signpost and start with the point."
strength = "weak"
terms = [
  { term = '[废廢][话話]不多[说說]', instead = "cut" },
  { term = '[众眾]所周知', instead = "cut, or name the source" },
  { term = '接下来我将为[你您]|接下來我將為[你您]|让我们一起来看看|讓我們一起來看看', instead = "start with it" },
  { term = '不言而喻|毋庸置疑', instead = "cut" },
  { term = '不[难難][发發][现現]|不可否[认認]的是', instead = "cut" },
  { term = '值得注意的是|需要指出的是', instead = "cut; state the point" },
]
flags = "众所周知，物流一直是短板。不难发现，三月的退货少了。"
passes = "三月退货少了一半，主要是换了快递公司。"
sources = [
  { source = "shuorenhua", where = "evals/legacy-v2.4.1/references/phrases-zh.md.txt, 开场套话, commit 9b91ed9464b9", seen = 2026-11-07 },
  { source = "slop-gate", where = "rules/chinese.json, zh-empty-opener, commit f78d5cbee0dc", seen = 2026-11-07 },
  { source = "speak-human-tw", where = "references/patterns.md, 36 預告式導言, commit 89b96e24fcfd", seen = 2026-11-07 },
]

[[sign]]
id = "zh-wrap-up-phrases"
category = "phrase"
kinds = ["any"]
