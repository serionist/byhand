# Artefacts: strings a chatbot leaves behind. Each has a `check`, and most alone settle the question.

[[sign]]
id = "any-chatgpt-citation-markup"
category = "artefact"
kinds = ["any"]
models = [{ family = "gpt", from = "4" }]
what = "Leaves ChatGPT's internal citation tokens or search placeholders in the text."
instead = "Delete the token and cite the source, or cut the claim."
strength = "strong"
check.any = 'contentReference\[oaicite|oaicite:\d|oai_citation|attributableIndex|turn\d+(?:file|image|news|search)\d+'
check.de = 'gehe zu suche nr'
# Finnish: ChatGPT's source chips pasted as text, two or more glued in a row, a name with +1 to +9 and the next name
# with no space (Suomi+5RakennusFakta+5NCC+5, kaupunki+2Oulun), as wikipedia-fi shows four of its six. A lone chip
# (keväällä. Oulun kaupunki+1) is left out: it is a person's sign-up list or score in every shape round 1 to 3 of #86's
# review tried (Matti+1, 1. Matti+1, Kiitos kutsusta. Matti+1 tulee., HIFK+3, count+1). C++, Disney+,
# Erasmus+-hanke, 2+1 and +358 pass.
check.fi = '[^\W\d_]{2}\+[1-9][^\W\d_]{2}'
flags = "The bridge opened in 1932. :contentReference[oaicite:3]{index=3}"
passes = "The bridge opened in 1932 (county archive, box 12)."
