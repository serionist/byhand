# Plain Turkish work text, invented, for tests/test_office_tr.py; it lives here, not in the test, as ruff reads the
# dotless ı as a confusable i, and Turkish writes it in nearly every word.
#
# Turkish office mail runs on set phrases (Bilgilerinize sunarım, Gereğini arz ederim, İyi çalışmalar, Kolay gelsin,
# Saygılarımla, Umarım iyisinizdir) and official letters on the passive and -mektedir, with tarafından, as the 2020
# regulation on official correspondence has them; humanizer-tr says these are right in official, legal and academic
# text, and keeps a person's greetings and closings. People write what its native reader found natural (aslında, Gelin
# birlikte bakalım, geniş bir yelpaze, günün sonunda, işin aslı, kilit rol oynamak, mevcut, titizlikle, yolculuk), real
# ownership with sahip olmak, the idioms the model wrote more (katkıda bulunmak, olanak sağlamak, yol açmak), Sonuç
# olarak before a summary that says something, Günümüzde before a number, and English laced through office Turkish
# (deadline, feedback, toplantı set etmek). Chat is often typed with no Turkish letters (toplantiyi, yarin). They are a
# person's, never a sign.
#
# Turkish typography is how people write: the apostrophe before a suffix on a name (Ankara’ya, İstanbul'da), the long
# dash before a line of dialogue, a spaced hyphen as a dash, the short dash in a range, curly and straight quotes, the
# decimal comma, % before the number, and capitals with the dotted İ.

