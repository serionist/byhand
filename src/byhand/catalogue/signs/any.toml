passes = "It's important to call them before noon: results vary by region."
sources = [
  { source = "wikipedia-en", where = "Hedging disclaimers, 2023-24, revision 1384165696", seen = 2026-11-07 },
  { source = "wikipedia-de", where = "Redaktionelle Kommentare, revision 271721424", seen = 2026-11-07 },
