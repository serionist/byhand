[[sign]]
id = "any-didactic-aside"
category = "structure"
kinds = ["any"]
models = "any"
what = "Stops to tell the reader which part deserves their attention."
instead = "State the point; the reader decides what to note."
strength = "usual"
check.en = '''\bit(?:['’]s| is) (?:crucial|essential|important|worth) (?:noting|to note)'''
# Hungarian needs its "hogy", and the phrase at a sentence's start: "fontos kiemelni a határidőt" is a plain request,
# and "a meghívóban fontos kiemelni, hogy …" or "nem fontos kiemelni, hogy …" a person's (the maintainer, #28).
check.hu = '(?:[.!?]\s+|^)\W*fontos (?:(?:azonban|itt|még|ugyanakkor|viszont) )?(?:hangsúlyozni|kiemelni|megjegyezni),? hogy\b'
flags = "It is important to note that results may vary by region."
passes = "It's important to call them before noon: results vary by region."
