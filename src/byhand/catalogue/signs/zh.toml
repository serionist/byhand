# Formatting.

[[sign]]
id = "zh-dash-density"
category = "formatting"
kinds = ["any"]
models = "any"
what = "Leans on dashes (——) to bolt clauses together, several in one paragraph."
instead = "Join clauses with ordinary punctuation; one dash a paragraph at most."
strength = "weak"
check = '—+[^—\n]+—+[^—\n]+—+'
flags = "新版周报很省事——数据自动导入——而且图表也是现成的——只需点一下发送。"
