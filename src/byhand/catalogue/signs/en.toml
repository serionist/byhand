# Tool markup that so far only English pages record. Nothing here is English as such, but an `any` sign needs sources
# in two languages, so these wait here until another language's source shows them.

[[sign]]
id = "en-gemini-citation-markup"
category = "artefact"
kinds = ["any"]
models = [{ family = "gemini", from = "1" }]
what = "Leaves Gemini's citation markers in the text."
instead = "Delete the marker and cite the source, or cut the claim."
strength = "strong"
check = '\[span_\d+\]\((?:start|end)_span\)|\[cite: ?\d+(?:, ?\d+)*\]'
flags = "The agency was founded in 2010[cite: 17]."
passes = "The agency was founded in 2010 [1]."
sources = [
  { source = "wikipedia-en-markup", where = "Gemini, revision 1383317735", seen = 2026-11-07 },
]

